import "_BeyondBattlePassUnlockStatus.proto";

message _BeyondBattlePassSchedule {
  repeated _BeyondBattlePassRewardTag reward_taken_list = 6;
  _BeyondBattlePassProduct product_info = 13;
  bool OEGGIOOLJKJ = 20000;
  bool is_extra_paid_reward_taken = 12;
  uint32 point = 7;
