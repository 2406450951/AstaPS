syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_UgcTriggerOuterClass";
import "_UgcTriggerAction.proto";
import "_UgcTriggerCondition.proto";

message _UgcTrigger {
  repeated _UgcTriggerAction action_list = 1;
  repeated _UgcTriggerCondition _condition_list = 8;
  uint32 guid = 11;
}
