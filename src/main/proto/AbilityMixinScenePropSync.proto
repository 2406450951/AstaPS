syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinScenePropSyncOuterClass";
import "MassivePropSyncInfo.proto";

message AbilityMixinScenePropSync {
  bool is_clear_all = 1;
  repeated int64 delete_id_list = 4;
  repeated MassivePropSyncInfo massive_prop_list = 10;
}
