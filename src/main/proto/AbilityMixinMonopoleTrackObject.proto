syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinMonopoleTrackObjectOuterClass";
import "Vector.proto";

message AbilityMixinMonopoleTrackObject {
  uint32 route_id = 2;
  uint32 DEBGCEBFKND = 7;
  Vector pos = 9;
  bool DGECPBBKPDE = 10;
  Vector rot = 11;
  float index = 14;
}
