syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BalloonGallerySettleInfoOuterClass";
import "GalleryStopReason.proto";

message BalloonGallerySettleInfo {
  uint32 owner_uid = 2;
  uint32 hit_count = 7;
  GalleryStopReason reason = 8;
  uint32 score = 15;
}
