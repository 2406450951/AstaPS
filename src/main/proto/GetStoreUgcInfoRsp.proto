syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetStoreUgcInfoRspOuterClass";
import "FKOADHFOMIK.proto";
import "HNEIDLNJDLD.proto";
import "UgcType.proto";

// 7.2 CmdId 3708
message GetStoreUgcInfoRsp {
  int32 retcode = 5;
  UgcType ugc_type = 11;
  oneof info {
    FKOADHFOMIK LanV5CardInfo = 6;
    HNEIDLNJDLD MusicInfo = 8;
  }
}
