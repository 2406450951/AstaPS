syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "Vector.proto";
import "VehicleInteractReason.proto";
import "VehicleInteractType.proto";
import "VehicleMember.proto";

message VehicleInteractRsp {
  Vector _vehicle_pos = 2;
  VehicleMember member = 3;
  Vector _vehicle_rot = 5;
  VehicleInteractType interact_type = 13;
  int32 retcode = 11;
  uint32 _vehicle_type = 15;
  uint32 gadget_id = 7;
  VehicleInteractReason interact_reason = 1;
  uint32 entity_id = 9;
}
