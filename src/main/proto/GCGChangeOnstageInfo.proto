syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGChangeOnstageInfoOuterClass";
import "GCGSkillPreviewInfo.proto";

message GCGChangeOnstageInfo {
  GCGSkillPreviewInfo change_onstage_preview_info = 3;
  bool is_quick = 7;
  uint32 card_guid = 10;
}
