syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_MonsterChessV2SettleNotifyOuterClass";
import "ExhibitionDisplayInfo.proto";

// 7.2 CmdId 80
message _MonsterChessV2SettleNotify {
  repeated ExhibitionDisplayInfo score_list = 4;
  repeated uint32 _win_round_list = 5;
  uint32 cur_score = 6;
  uint32 _infinite_win_num = 10;
  bool _is_infinite = 11;
  bool is_succ = 12;
  bool is_new_record = 13;
  uint32 score_limit = 14;
}
