syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneEntityMoveReqOuterClass";
import "MotionInfo.proto";

// 7.2 CmdId 1255
message SceneEntityMoveReq {
  uint32 scene_time = 2;
  MotionInfo motion_info = 9;
  uint32 reliable_seq = 12;
  uint32 entity_id = 15;
}
