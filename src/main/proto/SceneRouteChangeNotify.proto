syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneRouteChangeNotifyOuterClass";
import "SceneRouteChangeInfo.proto";

// 7.2 CmdId 20171
message SceneRouteChangeNotify {
  repeated SceneRouteChangeInfo route_list = 1;
  uint32 scene_id = 2;
  uint32 scene_time = 12;
}
