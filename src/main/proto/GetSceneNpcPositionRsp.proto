syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetSceneNpcPositionRspOuterClass";
import "NpcPositionInfo.proto";

// 7.2 CmdId 22128
message GetSceneNpcPositionRsp {
  int32 retcode = 8;
  uint32 scene_id = 12;
  repeated NpcPositionInfo npc_info_list = 15;
}
