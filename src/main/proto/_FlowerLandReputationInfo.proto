syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_FlowerLandReputationInfoOuterClass";
import "_FlowerLandReputationState.proto";

message _FlowerLandReputationInfo {
  uint32 uid = 1;
  uint32 next_refresh_time = 2;
  uint32 _current_task_group_id = 3;
  repeated uint32 _finished_task_id_list = 11;
  uint32 _current_task_id = 14;
  _FlowerLandReputationState _reputation_state = 15;
}
