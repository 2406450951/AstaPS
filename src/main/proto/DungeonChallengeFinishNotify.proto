syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "ChallengeFinishType.proto";
import "ChannellerSlabLoopDungeonResultInfo.proto";
import "CustomDungeonResultInfo.proto";
import "EffigyChallengeDungeonResultInfo.proto";
import "PotionDungeonResultInfo.proto";
import "StrengthenPointData.proto";

message DungeonChallengeFinishNotify {
  map<uint32, StrengthenPointData> strengthen_point_data_map = 12;
  uint32 challenge_record_type = 5;
  uint32 challenge_index = 4;
  bool is_success = 10;
  bool is_new_record = 8;
  uint32 time_cost = 13;
  ChallengeFinishType finish_type = 7;
  uint32 current_value = 14;
  oneof detail {
    EffigyChallengeDungeonResultInfo effigy_challenge_dungeon_result_info = 1006;
    PotionDungeonResultInfo potion_dungeon_result_info = 883;
    ChannellerSlabLoopDungeonResultInfo channeller_slab_loop_dungeon_result_info = 990;
    CustomDungeonResultInfo custom_dungeon_result_info = 1625;
  }
}
