syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LanV3BoatSettleNotifyOuterClass";
import "ExhibitionDisplayInfo.proto";
import "LanV3BoatSettleInfo.proto";

message LanV3BoatSettleNotify {
  uint32 play_index = 1;
  uint32 stage_type = 2;
  bool is_single = 3;
  repeated uint32 winner_uid_list = 4;
  repeated ExhibitionDisplayInfo score_list = 6;
  repeated LanV3BoatSettleInfo settle_info_list = 7;
  bool is_gallery_succ = 8;
  uint32 begin_time = 9;
  uint32 duration = 10;
}
