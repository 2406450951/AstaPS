syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BeyondActivityScheduleInfoOuterClass";
message _BeyondActivityScheduleInfo {
  uint32 schedule_id = 7;
  uint32 begin_time = 8;
  bool is_open = 10;
  uint32 end_time = 14;
  uint32 activity_id = 15;
}
