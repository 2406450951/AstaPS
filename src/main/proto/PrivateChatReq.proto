syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message PrivateChatReq {
  message _BeyondCostumeShareCode {
    bytes FEPAFANMNLK = 1;
  }
  message _BeyondLevelShare {
    string IENEGFFPHHO = 7;
    uint64 dungeon_guid = 10;
  }
  uint32 target_uid = 6;
  oneof content {
    string text = 5;
    uint32 icon = 7;
    PrivateChatReq._BeyondCostumeShareCode beyond_costume_share_code = 13;
    PrivateChatReq._BeyondLevelShare beyond_level_share = 11;
  }
}
