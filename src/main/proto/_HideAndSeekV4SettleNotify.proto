syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_HideAndSeekV4SettleNotifyOuterClass";
import "ExhibitionDisplayInfo.proto";
import "_HideAndSeekV4SettleInfo.proto";
import "_SettleReason.proto";

// 7.2 CmdId 24140
message _HideAndSeekV4SettleNotify {
  _SettleReason reason = 2;
  uint32 cost_time = 3;
  repeated _HideAndSeekV4SettleInfo settle_info_list = 4;
  bool CLKJCDNJDEP = 5;
  uint32 close_time = 6;
  repeated uint32 winner_list = 7;
  uint32 hunter_uid = 8;
  repeated ExhibitionDisplayInfo score_list = 9;
  bool is_record_score = 10;
  uint32 play_index = 11;
  uint32 begin_time = 13;
}
