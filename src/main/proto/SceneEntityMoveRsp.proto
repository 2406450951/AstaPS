syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneEntityMoveRspOuterClass";
import "MotionInfo.proto";

// 7.2 CmdId 3016
message SceneEntityMoveRsp {
  uint32 scene_time = 2;
  int32 retcode = 4;
  uint32 reliable_seq = 7;
  MotionInfo fail_motion = 12;
  uint32 entity_id = 15;
}
