syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WorldRoutineTypeInfoOuterClass";
import "WorldRoutineInfo.proto";

message WorldRoutineTypeInfo {
  repeated WorldRoutineInfo world_routine_info_list = 3;
  uint32 next_refresh_time = 13;
  uint32 routine_type = 14;
}
