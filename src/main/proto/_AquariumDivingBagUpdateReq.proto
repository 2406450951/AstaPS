syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_AquariumDivingBagUpdateReqOuterClass";
import "_AquariumDivingBagDetail.proto";
import "_AquariumDivingItem.proto";

// 7.2 CmdId 22518
message _AquariumDivingBagUpdateReq {
  uint32 _bait_count = 5;
  repeated _AquariumDivingItem drop_item_list = 6;
  bool _is_bag_full = 10;
  _AquariumDivingBagDetail _bag_detail = 11;
  repeated _AquariumDivingItem _pickup_item_list = 14;
}
