syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DeshretObeliskChestInfoOuterClass";
import "Vector.proto";

message DeshretObeliskChestInfo {
  uint32 _map_layer_id = 1;
  Vector pos = 2;
  uint32 group_id = 3;
  uint32 scene_id = 5;
  uint32 config_id = 9;
}
