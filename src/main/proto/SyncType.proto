syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SyncTypeOuterClass";
enum SyncType {
  SYNC_TYPE_NONE = 0;
  SYNC_TYPE_CREATE_CONNECT = 1;
  SYNC_TYPE_START_GAME = 2;
  SYNC_TYPE_PING = 3;
  SYNC_TYPE_FINISH_GAME = 4;
  SYNC_TYPE_SNAP_SHOT = 5;
  SYNC_TYPE_ACTION = 6;
}
