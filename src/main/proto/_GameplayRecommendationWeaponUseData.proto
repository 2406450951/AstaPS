syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_GameplayRecommendationWeaponUseDataOuterClass";
import "_GameplayRecommendationWeaponSourceType.proto";
import "_GameplayRecommendationWeaponUsageRate.proto";

message _GameplayRecommendationWeaponUseData {
  _GameplayRecommendationWeaponSourceType source = 11;
  _GameplayRecommendationWeaponUsageRate _usage_rate = 13;
  uint32 _use_weapon_id = 15;
}
