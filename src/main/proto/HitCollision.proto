syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "HitColliderType.proto";
import "Vector.proto";

message HitCollision {
  Vector hit_point = 9;
  Vector hit_dir = 10;
  float OMEMJMGDNPP = 20000;
  float EGIAGADINML = 20001;
  HitColliderType hit_collider_type = 12;
  float PFLEHLDGODB = 20002;
  int32 hit_box_index = 3;
}
