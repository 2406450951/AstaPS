syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message GetScenePointRsp {
  repeated uint32 JHHBKAOPBAH = 20000;
  repeated uint32 unhide_point_list = 14;
  repeated uint32 IEMCNADNPED = 20001;
  repeated uint32 HBKHEKLMEKN = 9;
  repeated uint32 unlocked_point_list = 1;
  repeated uint32 hide_point_list = 4;
  repeated uint32 OLEEDBKCAAN = 20002;
  repeated uint32 group_unlimit_point_list = 2;
  repeated uint32 unlock_area_list = 11;
  uint32 belong_uid = 6;
  bool is_relogin = 12;
  int32 retcode = 15;
  uint32 scene_id = 13;
}
