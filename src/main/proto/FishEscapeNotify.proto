syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FishEscapeNotifyOuterClass";
import "FishEscapeReason.proto";
import "Vector.proto";

// 7.2 CmdId 7022
message FishEscapeNotify {
  uint32 uid = 2;
  repeated uint32 fish_id_list = 4;
  Vector pos = 7;
  FishEscapeReason reason = 8;
}
