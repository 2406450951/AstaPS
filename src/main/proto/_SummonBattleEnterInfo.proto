syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SummonBattleEnterInfoOuterClass";
import "_ActivityAvatarInfo.proto";

message _SummonBattleEnterInfo {
  bool _is_restart = 6;
  repeated _ActivityAvatarInfo avatar_list = 10;
  uint32 difficulty = 12;
}
