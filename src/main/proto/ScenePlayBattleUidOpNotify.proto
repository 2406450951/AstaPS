syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ScenePlayBattleUidOpNotifyOuterClass";
// 7.2 CmdId 21921
message ScenePlayBattleUidOpNotify {
  uint32 param_index = 1;
  repeated uint32 param_target_list = 2;
  uint32 param_duration = 3;
  repeated uint32 param_list = 5;
  string param_str = 6;
  uint32 op = 7;
  repeated uint32 uid_list = 9;
  uint32 play_type = 10;
  uint32 play_id = 13;
  uint32 entity_id = 14;
}
