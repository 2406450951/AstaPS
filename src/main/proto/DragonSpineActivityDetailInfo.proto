syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "DragonSpineChapterInfo.proto";

message DragonSpineActivityDetailInfo {
  repeated DragonSpineChapterInfo chapter_info_list = 1;
  uint32 IKKMKCFOINJ = 20000;
  uint32 content_finish_time = 20001;
  uint32 ABBFOLNPGNE = 20002;
