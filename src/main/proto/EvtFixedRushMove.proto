syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtFixedRushMoveOuterClass";
import "Vector.proto";

message EvtFixedRushMove {
  float max_speed = 1;
  uint32 entity_id = 2;
  float MBANNCLEBPP = 3;
  bool BLPNGICNCEO = 4;
  bool FPHFMEKFJIF = 5;
  float FBDLIEKPBEJ = 6;
  float DHADPMJIINL = 7;
  float DFDKHAIDDIP = 8;
  int32 param_index = 9;
  string override_collider = 11;
  float speed = 12;
  Vector target_pos = 14;
  repeated uint32 animator_state_id_list = 15;
}
