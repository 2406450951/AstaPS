syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PerformOperationNotifyOuterClass";
import "OperateType.proto";
import "Vector.proto";

// 7.2 CmdId 7546
message PerformOperationNotify {
  Vector pos = 6;
  uint32 entity_id = 9;
  uint32 index = 10;
  OperateType operate_type = 11;
  Vector rot = 12;
}
