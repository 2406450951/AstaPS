syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BrickBreakerSettleNotifyOuterClass";
import "BrickBreakerSettleNotify__SettleReason.proto";
import "Uint32Pair.proto";

message BrickBreakerSettleNotify {
  uint32 gallery_id = 1;
  BrickBreakerSettleNotify__SettleReason reason = 2;
  uint32 time = 3;
  uint32 score = 4;
  uint32 combo = 5;
  bool is_new_record = 6;
  bool is_single_mode = 7;
  uint32 level_id = 8;
  bool is_dungeon = 9;
  repeated Uint32Pair update_skill_list = 10;
  repeated uint32 NIDCEMLJPIL = 11;
  uint32 ICEFCDAEMDA = 12;
  uint32 GMNGPNMPNFP = 13;
  uint32 KJHCJFOLJBO = 14;
}
