syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ScenePlayBattleResultNotifyOuterClass";
import "ScenePlayBattleSettlePlayerInfo.proto";
import "ScenePlayBattleSettleRewardInfo.proto";

// 7.2 CmdId 23897
message ScenePlayBattleResultNotify {
  uint32 cost_time = 2;
  repeated ScenePlayBattleSettleRewardInfo settle_reward_info_list = 3;
  repeated ScenePlayBattleSettlePlayerInfo settle_player_info_list = 4;
  uint32 play_type = 6;
  bool is_win = 13;
  uint32 play_id = 14;
}
