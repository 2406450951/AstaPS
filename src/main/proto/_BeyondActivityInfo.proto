syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BeyondActivityInfoOuterClass";
import "_AlbumDetailInfo.proto";
import "_AnniversaryDetailInfo.proto";
import "_BeyondActivityWatcherInfo.proto";
import "_FashionWelfareDetailInfo.proto";
import "_LevelScoreDetailInfo.proto";
import "_WelfareDetailInfo.proto";

message _BeyondActivityInfo {
  repeated uint32 BHNEODJHIJF = 1;
  uint32 schedule_id = 2;
  repeated uint64 activity_live_id_list = 3;
  uint32 end_time = 4;
  uint32 begin_time = 5;
  uint32 activity_type = 6;
  uint32 first_day_start_time = 7;
  repeated _BeyondActivityWatcherInfo watcher_info_list = 8;
  bool is_finished = 9;
  bool GDMPLLDHJEG = 10;
  uint32 activity_id = 11;
  repeated uint32 OLAEGPPFDPI = 12;
  repeated uint32 taken_reward_list = 13;
  map<uint32, uint32> activity_coin_map = 14;
  bool CIGOJAFJGCF = 15;
  oneof detail {
    _AlbumDetailInfo AlbumDetailInfo = 719;
    _LevelScoreDetailInfo LevelScoreDetailInfo = 1548;
    _AnniversaryDetailInfo AnniversaryDetailInfo = 1674;
    _WelfareDetailInfo WelfareDetailInfo = 1823;
    _FashionWelfareDetailInfo FashionWelfareDetailInfo = 1998;
  }
}
