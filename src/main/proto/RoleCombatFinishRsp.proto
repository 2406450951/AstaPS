syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatFinishRspOuterClass";
import "RoleCombatFinishedLevelInfo.proto";

// 7.2 CmdId 20120
message RoleCombatFinishRsp {
  repeated RoleCombatFinishedLevelInfo finished_level_list = 7;
  repeated uint32 IANDGLAPAMP = 8;
  uint32 difficulty_id = 10;
  uint32 finished_round_num = 11;
  int32 retcode = 13;
}
