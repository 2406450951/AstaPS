syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_AdventurerStatueDriftBottleCardDetailOuterClass";
import "Uint32Pair.proto";

message _AdventurerStatueDriftBottleCardDetail {
  repeated Uint32Pair NBPJLNNDIPA = 2;
  uint32 _background_id = 3;
  uint64 guid = 5;
  uint32 furniture_id = 6;
  uint32 create_time = 8;
  uint32 AMOJPDJBOPN = 9;
  repeated Uint32Pair KOJNMDJBPCI = 13;
  uint32 owner_uid = 15;
}
