syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "Vector.proto";

message TreasureSeelieRegionData {
  Vector region_center_pos = 8;
  uint32 scene_id = 10;
  uint32 OKGPCPGPPMG = 20000;
  uint32 LPGPONIONFK = 20001;
  uint32 open_time = 3;
  float region_radius = 9;
  uint32 NPNNLOKOKFD = 20002;
  bool is_done = 7;
  bool is_open = 2;
  uint32 region_id = 6;
}
