option java_outer_classname = "VineManRunPlatformInfoOuterClass";
import "HGENOPABHGG.proto";

message VineManRunPlatformInfo {
  uint64 start_time = 1;
  uint32 FBNFFDDHNFM = 2;
  uint32 EEILJPNIHDL = 3;
  float HNGAKHIIKPH = 4;
  float speed = 5;
  bool is_started = 6;
  repeated HGENOPABHGG IDLFCNLHLLE = 7;
  bool ANMLCOGACLC = 8;
  uint32 OFJKNODKFJB = 9;
  uint32 OPNEPAEKHIP = 10;
  uint32 start_index = 11;
}
