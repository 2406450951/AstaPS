    AGPIPKJNBMD PlayerHp = 11;
    FIJIECDAAEL SkillArea = 12;
    KEGMDBHJOAF TeamAndFaction = 13;
    NPOLOHFILLL MiniMap = 14;
    CKENABMMLFB NoneIntrinsicUi = 15;
    LIDKJAPBMHB BasicActiveControl = 16;
