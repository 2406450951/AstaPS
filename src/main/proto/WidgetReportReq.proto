syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WidgetReportReqOuterClass";
// 7.2 CmdId 5815
message WidgetReportReq {
  bool is_client_collect = 2;
  uint32 material_id = 7;
  bool is_clear_sky_crystal_hint = 8;
  uint32 weather_wizard_shield_value = 10;
  bool is_clear_hint = 11;
}
