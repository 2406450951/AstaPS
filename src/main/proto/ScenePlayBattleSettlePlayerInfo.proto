syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ScenePlayBattleSettlePlayerInfoOuterClass";
import "ExhibitionDisplayInfo.proto";
import "ProfilePicture.proto";

message ScenePlayBattleSettlePlayerInfo {
  uint32 statistic_id = 3;
  int64 param = 4;
  string nickname = 5;
  repeated ExhibitionDisplayInfo card_list = 7;
  uint32 uid = 9;
  string online_id = 11;
  uint32 head_image = 12;
  ProfilePicture profile_picture = 14;
}
