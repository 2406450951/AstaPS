  uint32 type = 3;
  uint32 avatar_id = 9;
  oneof detail {
    GameplayRecommendationSkillResponse SkillResponse = 128;
    GameplayRecommendationReliquaryResponse ReliquaryResponse = 148;
    _GameplayRecommendationReliquarySetResponse ReliquarySetResponse = 492;
    _GameplayRecommendationElementReliquarySetResponse ElementReliquarySetResponse = 776;
    GameplayRecommendationElementReliquaryResponse ElementReliquaryResponse = 991;
    _GameplayRecommendationElementWeaponResponse ElementWeaponResponse = 1466;
    _GameplayRecommendationWeaponResponse WeaponResponse = 1872;
  }
}
