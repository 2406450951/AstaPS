syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message MainCoop {
  enum Status {
    Status_INVALID = 0;
    Status_RUNNING = 1;
    Status_FINISHED = 2;
  }
  map<uint32, int32> temp_var_map = 20000;
  map<uint32, int32> normal_var_map = 20001;
  map<uint32, uint32> seen_ending_map = 8;
  repeated uint32 save_point_id_list = 1;
  uint32 self_confidence = 4;
  uint32 id = 9;
  MainCoop.Status status = 13;
}
