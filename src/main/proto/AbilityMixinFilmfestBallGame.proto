syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinFilmfestBallGameOuterClass";
import "_FilmfestBallGameSyncAction.proto";
import "_FilmfestBallGameSyncCreateConnect.proto";
import "_FilmfestBallGameSyncFinishGame.proto";
import "_FilmfestBallGameSyncPing.proto";
import "_FilmfestBallGameSyncSnapShot.proto";
import "_SyncType.proto";

message AbilityMixinFilmfestBallGame {
  int32 retcode = 6;
  _SyncType sync_type = 8;
  oneof DLACDGFBDBM {
    _FilmfestBallGameSyncCreateConnect SyncCreateConnect = 3;
    _FilmfestBallGameSyncAction SyncAction = 5;
    _FilmfestBallGameSyncPing SyncPing = 10;
    _FilmfestBallGameSyncFinishGame SyncFinishGame = 11;
    _FilmfestBallGameSyncSnapShot SyncSnapShot = 13;
  }
}
