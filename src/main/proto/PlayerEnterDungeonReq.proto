syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "DungeonEnterPosInfo.proto";

message PlayerEnterDungeonReq {
  DungeonEnterPosInfo enter_pos_info = 10;
  uint32 BAEJLCIOPMI = 20000;
  uint32 dungeon_id = 1;
  uint32 point_id = 14;
  uint32 CCIOMCLOGDK = 20001;
  bool _is_continue = 13;
}
