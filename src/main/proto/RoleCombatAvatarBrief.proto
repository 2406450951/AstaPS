syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatAvatarBriefOuterClass";
import "_AvatarMirrorType.proto";

message RoleCombatAvatarBrief {
  _AvatarMirrorType avatar_type = 1;
  uint32 costume_id = 5;
  uint32 avatar_level = 6;
  uint32 _avatar_element_type = 9;
  uint32 avatar_id = 10;
}
