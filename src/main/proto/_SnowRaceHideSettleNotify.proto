syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SnowRaceHideSettleNotifyOuterClass";
import "ExhibitionDisplayInfo.proto";
import "_SnowRaceHideSettleInfo.proto";

// 7.2 CmdId 84
message _SnowRaceHideSettleNotify {
  bool is_record_score = 1;
  uint32 close_time = 4;
  bool CLKJCDNJDEP = 5;
  repeated _SnowRaceHideSettleInfo _settle_list = 7;
  uint32 cost_time = 8;
  repeated ExhibitionDisplayInfo score_list = 11;
  uint32 begin_time = 12;
  uint32 hunter_uid = 13;
  repeated uint32 winner_list = 15;
}
