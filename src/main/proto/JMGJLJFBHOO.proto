option java_outer_classname = "JMGJLJFBHOOOuterClass";
import "FJOAOGALIIJ.proto";
import "FMIGCKIIDKC.proto";
import "MKNHKHMILCG.proto";
import "NNADJMJHEBA.proto";
import "PLCNLFDMGEI.proto";

message JMGJLJFBHOO {
  MKNHKHMILCG KBPNCLFKHFO = 1;
  bool is_show = 2;
  string AKEAINMJDHL = 3;
  string JEHGKAFLHBL = 502;
