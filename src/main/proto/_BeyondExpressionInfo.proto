syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message _BeyondExpressionInfo {
  enum LPGEIAEOHPI {
    LPGEIAEOHPI_NONE = 0;
    LPGEIAEOHPI_EMOJI = 1;
    LPGEIAEOHPI_POSE = 2;
    LPGEIAEOHPI_SUIT_POSE = 3;
    LPGEIAEOHPI_GOLDEN_POSE = 4;
  }
  uint32 id = 3;
  _BeyondExpressionInfo.LPGEIAEOHPI JIIOBGLHIHH = 2;
  uint32 index = 1;
}
