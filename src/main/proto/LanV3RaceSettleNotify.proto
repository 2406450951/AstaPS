syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LanV3RaceSettleNotifyOuterClass";
message LanV3RaceSettleNotify {
  uint32 gallery_id = 1;
  uint32 level_id = 2;
  bool is_success = 3;
  bool is_new_record = 4;
  uint32 score = 5;
  uint32 remain_time = 6;
  uint32 FIELHHOCKPN = 7;
  uint32 EDDECACPPDC = 8;
}
