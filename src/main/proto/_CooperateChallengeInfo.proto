syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_CooperateChallengeInfoOuterClass";
import "DPECKFJNFLO.proto";
import "JOAIMBFJKNP.proto";

message _CooperateChallengeInfo {
  uint32 ILMJCKKFBOA = 1;
  uint32 IKNICBPCNHP = 2;
  uint32 difficulty_id = 6;
  repeated JOAIMBFJKNP player_info_list = 7;
  repeated DPECKFJNFLO level_info_list = 11;
  repeated uint32 MJFJMEDEFPD = 12;
  repeated uint32 HOAPLDOIILJ = 13;
  uint32 COCKCJELFIC = 14;
}
