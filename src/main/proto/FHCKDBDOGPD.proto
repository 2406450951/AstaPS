syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FHCKDBDOGPDOuterClass";
import "DIPOLPNEPMH.proto";

message FHCKDBDOGPD {
  DIPOLPNEPMH BICMMLKCOIB = 1;
  oneof param {
    bool BoolValue = 11;
    uint32 UintValue = 12;
    int32 IntValue = 13;
    float FloatValue = 14;
    string StringValue = 15;
    uint32 EnumValue = 16;
    bytes ObjectValue = 17;
  }
}
