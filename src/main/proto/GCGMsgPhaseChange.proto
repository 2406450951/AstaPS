syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGMsgPhaseChangeOuterClass";
import "GCGPhaseType.proto";
import "ILGMKAJCGEO.proto";
import "Uint32Pair.proto";

message GCGMsgPhaseChange {
  GCGPhaseType JMKCCEFAPJH = 8;
  repeated Uint32Pair allow_controller_list = 9;
  GCGPhaseType BDCNEDOEHFN = 11;
  ILGMKAJCGEO AFFEAKPKIDD = 14;
}
