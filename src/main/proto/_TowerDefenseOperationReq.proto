syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TowerDefenseOperationReqOuterClass";
import "_ArtifactOp.proto";
import "_BuildOp.proto";
import "_ConfirmChallengeFinishOp.proto";
import "_DestroyOp.proto";
import "_RedrawOp.proto";
import "_SkillOp.proto";
import "_UpgradeOp.proto";

// 7.2 CmdId 1648
message _TowerDefenseOperationReq {
  oneof op {
    _ConfirmChallengeFinishOp ConfirmChallengeFinishOp = 63;
    _BuildOp BuildOp = 524;
    _RedrawOp RedrawOp = 773;
    _UpgradeOp UpgradeOp = 1105;
    _SkillOp SkillOp = 1154;
    _DestroyOp DestroyOp = 1800;
    _ArtifactOp ArtifactOp = 2028;
  }
}
