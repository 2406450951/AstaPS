syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PotionEnterDungeonReqOuterClass";
import "PotionAvatarInfo.proto";

message PotionEnterDungeonReq {
  uint32 stage_id = 1;
  uint32 level_id = 2;
  uint32 mode_id = 3;
  repeated PotionAvatarInfo avatar_info_list = 4;
  repeated uint32 buff_id_list = 5;
}
