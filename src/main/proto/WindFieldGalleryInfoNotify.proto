syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WindFieldGalleryInfoNotifyOuterClass";
message WindFieldGalleryInfoNotify {
  uint32 element_ball_num = 1;
  uint32 coin_num = 2;
  uint32 killed_monster_num = 3;
  uint32 challenge_total_time = 4;
  uint32 challenge_timestamp = 5;
  uint32 show_id = 6;
  uint32 OHJOIGJINEN = 7;
  uint32 CMCMBJGDGHB = 8;
}
