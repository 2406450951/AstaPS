syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CustomDungeonAbstractOuterClass";
message CustomDungeonAbstract {
  uint32 first_publish_time = 1;
  uint32 AGODOFEOPJK = 6;
  uint32 HBAFICFAOOM = 8;
  uint32 total_coin_num = 14;
  map<uint32, uint32> brick_statistics_map = 15;
}
