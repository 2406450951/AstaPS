syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GalleryWillStartCountdownNotifyOuterClass";
import "GalleryStartSource.proto";

// 7.2 CmdId 487
message GalleryWillStartCountdownNotify {
  uint32 end_time = 1;
  uint32 gallery_id = 7;
  GalleryStartSource start_source = 12;
  bool is_end = 14;
}
