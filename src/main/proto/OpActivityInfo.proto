syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OpActivityInfoOuterClass";
import "BonusOpActivityInfo.proto";

message OpActivityInfo {
  uint32 end_time = 1;
  uint32 begin_time = 2;
  bool is_has_change = 3;
  repeated uint32 LNNDLFIBDOA = 4;
  uint32 schedule_id = 7;
  uint32 activity_id = 9;
  oneof detail {
    BonusOpActivityInfo BonusInfo = 10;
  }
}
