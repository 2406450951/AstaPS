syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message AvatarSkillDepotChangeNotify {
  repeated uint32 _unlocked_skill_depot_id_list = 4;
  map<uint32, uint32> skill_level_map = 2;
  repeated uint32 talent_id_list = 13;
  repeated uint32 _special_proud_skill_list = 15;
  map<uint32, uint32> proud_skill_extra_level_map = 5;
  repeated uint32 proud_skill_list = 3;
  uint32 core_proud_skill_level = 12;
  uint32 entity_id = 10;
  uint32 skill_depot_id = 7;
  uint64 avatar_guid = 14;
}
