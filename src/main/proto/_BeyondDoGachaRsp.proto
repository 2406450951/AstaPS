syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BeyondDoGachaRspOuterClass";
import "BeyondGachaTypeState.proto";
import "_BeyondGachaItem.proto";

// 7.2 CmdId 7137
message _BeyondDoGachaRsp {
  uint32 _beyond_gacha_type = 1;
  uint32 HJNKOJIMAKI = 2;
  uint32 schedule_id = 3;
  uint32 PLAOLOOAJJO = 4;
  bool is_under_minors_restrict = 5;
  uint32 gacha_times = 6;
  int32 retcode = 7;
  BeyondGachaTypeState gacha_type_state = 8;
  uint32 daily_gacha_times = 9;
  uint32 MJCAEJEEANO = 13;
  repeated _BeyondGachaItem _beyond_gacha_item_list = 14;
  bool is_under_general_restrict = 15;
}
