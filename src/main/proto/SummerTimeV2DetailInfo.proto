syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "SummerTimeV2BoatStageInfo.proto";
import "SummerTimeV2DungeonStageInfo.proto";

message SummerTimeV2DetailInfo {
  repeated SummerTimeV2BoatStageInfo boat_stage_info_list = 2;
  repeated SummerTimeV2DungeonStageInfo dungeon_stage_info_list = 1;
  bool is_content_closed = 3;
  uint32 cur_dungeon_reward_limit = 5;
  uint32 taken_reward_count = 4;
}
