syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MatchReasonOuterClass";
enum MatchReason {
  MATCH_REASON_MATCH_NONE = 0;
  MATCH_REASON_MATCH_FINISH = 1;
  MATCH_REASON_MATCH_PLAYER_CANCEL = 2;
  MATCH_REASON_MATCH_TIMEOUT = 3;
  MATCH_REASON_MATCH_PLAYER_CONFIRM = 4;
  MATCH_REASON_MATCH_FAILED = 5;
  MATCH_REASON_MATCH_SYSTEM_ERROR = 6;
  MATCH_REASON_MATCH_INTERRUPTED = 7;
  MATCH_REASON_MATCH_MP_UNAVAILABLE = 8;
  MATCH_REASON_MATCH_CONFIRM_TIMEOUT = 9;
}
