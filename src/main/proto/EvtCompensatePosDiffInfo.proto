syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtCompensatePosDiffInfoOuterClass";
import "Vector.proto";

message EvtCompensatePosDiffInfo {
  uint32 entity_id = 3;
  uint32 cur_hash = 4;
  int32 face_angle_compact = 8;
  Vector cur_pos = 12;
  uint32 normalized_time_compact = 15;
}
