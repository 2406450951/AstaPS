syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RegionSearchStateOuterClass";
enum RegionSearchState {
  REGION_SEARCH_STATE_REGION_SEARCH_NONE = 0;
  REGION_SEARCH_STATE_REGION_SEARCH_UNSTARTED = 1;
  REGION_SEARCH_STATE_REGION_SEARCH_STARTED = 2;
  REGION_SEARCH_STATE_REGION_SEARCH_WAIT_REWARD = 3;
  REGION_SEARCH_STATE_REGION_SEARCH_FINISHED = 4;
}
