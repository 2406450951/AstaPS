syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "HomeBlockSubFieldData.proto";
import "Vector.proto";

message HomeBlockFieldData {
  Vector pos = 9;
  repeated HomeBlockSubFieldData sub_field_list = 11;
  Vector rot = 13;
  uint32 guid = 14;
  uint32 furniture_id = 1;
}
