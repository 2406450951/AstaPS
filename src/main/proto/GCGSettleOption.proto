enum GCGSettleOption {
  GCGSETTLE_OPTION_GCG_SETTLE_OPT_NONE = 0;
  GCGSETTLE_OPTION_GCG_SETTLE_OPT_EXIT = 1;
  GCGSETTLE_OPTION_GCG_SETTLE_OPT_CONTINUE = 2;
  GCGSETTLE_OPTION_GCG_SETTLE_OPT_RESTART = 3;
}
