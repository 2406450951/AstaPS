syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "MapMarkPoint.proto";

message MarkMapReq {
  enum Operation {
    Operation_ADD = 0;
    Operation_MOD = 1;
    Operation_DEL = 2;
    Operation_GET = 3;
  }
  MapMarkPoint mark = 3;
  MapMarkPoint old = 6;
  MarkMapReq.Operation op = 2;
}
