syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGPlayerBriefDataOuterClass";
import "ProfilePicture.proto";

message GCGPlayerBriefData {
  ProfilePicture profile_picture = 1;
  string _xbox_gamertag = 2;
  repeated uint32 card_id_list = 4;
  string online_id = 9;
  map<uint32, uint32> card_face_map = 11;
  uint32 controller_id = 12;
  string psn_id = 13;
  string nick_name = 14;
  uint32 uid = 15;
}
