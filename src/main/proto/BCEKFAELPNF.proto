syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BCEKFAELPNFOuterClass";
import "BDOGLANHECH.proto";
import "OBEBLOGNHCE.proto";

message BCEKFAELPNF {
  int32 KOAOELLDNDI = 1;
  oneof detail {
    OBEBLOGNHCE NormalTrack = 11;
    BDOGLANHECH EffectTrack = 12;
  }
}
