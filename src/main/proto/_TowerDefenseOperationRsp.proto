syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TowerDefenseOperationRspOuterClass";
import "_ArtifactOp.proto";
import "_BuildOp.proto";
import "_ConfirmChallengeFinishOp.proto";
import "_DestroyOp.proto";
import "_RedrawOp.proto";
import "_SkillOp.proto";
import "_UpgradeOp.proto";

// 7.2 CmdId 4188
message _TowerDefenseOperationRsp {
  int32 retcode = 5;
  oneof op {
    _DestroyOp DestroyOp = 118;
    _BuildOp BuildOp = 310;
    _UpgradeOp UpgradeOp = 470;
    _SkillOp SkillOp = 949;
    _ArtifactOp ArtifactOp = 1577;
    _ConfirmChallengeFinishOp ConfirmChallengeFinishOp = 1726;
    _RedrawOp RedrawOp = 1778;
  }
}
