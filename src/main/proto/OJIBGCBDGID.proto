import "CGAMFEGGCJH.proto";
import "DBGPNILPIGK.proto";
import "GDNMOGLFIHE.proto";
import "KGCFEMBDCLN.proto";
import "MPGPMCFIPLL.proto";

message OJIBGCBDGID {
  GDNMOGLFIHE FJLNFAJMCMO = 1;
  string MIMMAKMHFOE = 502;
  oneof detail {
    MPGPMCFIPLL BeyondBulletMoveVector = 11;
    DBGPNILPIGK BeyondBulletMoveParabola = 12;
    CGAMFEGGCJH BeyondBulletMoveFollow = 13;
    KGCFEMBDCLN BeyondBulletMoveSurround = 14;
