syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_ActivityClientPlayStartRspOuterClass";
import "LEMOGBODJOB.proto";
import "_ClientPlayType.proto";

// 7.2 CmdId 7648
message _ActivityClientPlayStartRsp {
  uint32 level_id = 3;
  string _client_play_transaction = 5;
  _ClientPlayType _client_play_type = 7;
  int32 retcode = 11;
  uint32 activity_id = 12;
  oneof info {
    LEMOGBODJOB LanV5CardInfo = 1646;
  }
}
