syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeCreateBlueprintReqOuterClass";
import "HomeSceneArrangementInfo.proto";

// 7.2 CmdId 21734
message HomeCreateBlueprintReq {
  uint32 gen_share_code_count = 1;
  HomeSceneArrangementInfo scene_arrangement_info = 2;
  string server_share_code = 3;
  uint32 slot_id = 5;
}
