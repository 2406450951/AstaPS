syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "QuickUseWidgetReqOuterClass";
import "WidgetCameraInfo.proto";
import "WidgetCreateLocationInfo.proto";
import "WidgetCreatorInfo.proto";
import "WidgetThunderBirdFeatherInfo.proto";
import "_WidgetClientDetectorInfo.proto";
import "_WidgetNewDetectorInfo.proto";
import "_WidgetSorushInfo.proto";

// 7.2 CmdId 9655
message QuickUseWidgetReq {
  bool _is_force_ignore_cd = 758;
  uint32 client_sequence = 1591;
  oneof param {
    WidgetCreateLocationInfo LocationInfo = 328;
    _WidgetSorushInfo SorushInfo = 1214;
    WidgetThunderBirdFeatherInfo ThunderBirdFeatherInfo = 1360;
    WidgetCameraInfo CameraInfo = 1589;
    WidgetCreatorInfo CreatorInfo = 1907;
    _WidgetNewDetectorInfo NewDetectorInfo = 3166;
    _WidgetClientDetectorInfo ClientDetectorInfo = 18636;
  }
}
