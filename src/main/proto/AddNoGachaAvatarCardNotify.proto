syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AddNoGachaAvatarCardTransferItem.proto";

message AddNoGachaAvatarCardNotify {
  repeated AddNoGachaAvatarCardTransferItem transfer_item_list = 9;
  uint32 avatar_id = 6;
  uint32 reason = 14;
  bool is_transfer_to_item = 10;
  uint32 initial_level = 20000;
  uint32 item_id = 13;
  uint32 initial_promote_level = 20001;
}
