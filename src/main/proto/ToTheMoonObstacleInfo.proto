syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ToTheMoonObstacleInfoOuterClass";
import "MathQuaternion.proto";
import "ToTheMoonObstacleInfo__ShapeType.proto";
import "Vector.proto";

message ToTheMoonObstacleInfo {
  MathQuaternion rotation = 7;
  int32 handle_id = 8;
  ToTheMoonObstacleInfo__ShapeType type = 11;
  Vector center = 12;
  Vector half_extents = 13;
}
