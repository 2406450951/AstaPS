syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanV6CardSourcePlayerOuterClass";
import "ProfilePicture.proto";

message _LanV6CardSourcePlayer {
  uint32 uid = 3;
  string _creator_online_id = 5;
  string _xuid = 6;
  ProfilePicture profile_picture = 7;
  string _xbox_gamertag = 10;
  string psn_id = 13;
  string nickname = 15;
}
