syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerMatchSuccNotifyOuterClass";
import "GCGMatchInfo.proto";
import "GeneralMatchInfo.proto";
import "MatchType.proto";

// 7.2 CmdId 20579
message PlayerMatchSuccNotify {
  uint32 dungeon_id = 6;
  MatchType match_type = 7;
  uint32 mp_play_id = 8;
  GCGMatchInfo gcg_match_info = 11;
  GeneralMatchInfo general_match_info = 13;
  uint32 confirm_end_time = 14;
  uint32 host_uid = 15;
}
