syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_UgcDungeonPlayRecordOuterClass";
import "_UgcDungeonSettleType.proto";

message _UgcDungeonPlayRecord {
  uint32 version = 1;
  uint32 used_time = 10;
  uint32 score = 11;
  _UgcDungeonSettleType _settle_type = 13;
  uint64 dungeon_guid = 15;
}
