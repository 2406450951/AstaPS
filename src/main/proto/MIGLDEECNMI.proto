syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MIGLDEECNMIOuterClass";
import "BPMPDNDBGOL.proto";
import "MGMOFKDNODC.proto";

message MIGLDEECNMI {
  int32 EGLBMKBLDDL = 1;
  uint32 DCMMOCGACHM = 2;
  oneof detail {
    BPMPDNDBGOL Track = 11;
    MGMOFKDNODC Clip = 12;
  }
}
