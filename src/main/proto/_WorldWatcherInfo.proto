syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_WorldWatcherInfoOuterClass";
message _WorldWatcherInfo {
  bool is_taken_reward = 1;
  uint32 cur_progress = 4;
  map<uint32, int32> _gallery_state_map = 10;
  uint32 watcher_id = 14;
  uint32 total_progress = 15;
}
