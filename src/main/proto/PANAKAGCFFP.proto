syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PANAKAGCFFPOuterClass";
import "ProfilePicture.proto";
import "_MonsterChessV2CardDetail.proto";
import "_MonsterChessV2FlagInfo.proto";
import "_MonsterChessV2TeamInfo.proto";

message PANAKAGCFFP {
  ProfilePicture profile_picture = 2;
  repeated _MonsterChessV2FlagInfo _flag_info_list = 4;
  repeated uint32 _artifact_id_list = 5;
  repeated _MonsterChessV2TeamInfo team_info_list = 6;
  repeated _MonsterChessV2CardDetail _monster_card_list = 8;
  uint32 _monster_chess_team_num = 9;
  string _xbox_gamertag = 10;
  string nick_name = 11;
  string online_id = 13;
}
