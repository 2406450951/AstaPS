syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BKNOJABCGDPOuterClass";
import "_UgcShortVideoBriefInfo.proto";

message BKNOJABCGDP {
  string creator_nickname = 5;
  bool NGNFFODNLAN = 8;
  uint32 first_publish_time = 9;
  uint32 publish_time = 10;
  uint32 schedule_id = 11;
  bool is_psn_platform = 12;
  uint64 ugc_guid = 13;
  uint32 uid = 14;
  uint32 version = 15;
  string _xbox_gamertag = 639;
  string _xuid = 1067;
  string psn_id = 1442;
  string _creator_online_id = 1989;
  oneof brief {
    _UgcShortVideoBriefInfo ShortVideoBrief = 1;
  }
}
