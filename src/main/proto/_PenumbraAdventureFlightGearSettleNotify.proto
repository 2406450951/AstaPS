syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_PenumbraAdventureFlightGearSettleNotifyOuterClass";
message _PenumbraAdventureFlightGearSettleNotify {
  uint32 level_id = 1;
  bool is_success = 2;
  uint32 _collected_coin_num = 3;
  uint32 cost_time = 4;
  uint32 score = 5;
  bool EHKEKMCIECK = 6;
  uint32 total_coin_num = 7;
}
