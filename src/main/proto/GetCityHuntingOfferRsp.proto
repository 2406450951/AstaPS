syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetCityHuntingOfferRspOuterClass";
import "HuntingOfferData.proto";
import "HuntingPair.proto";

// 7.2 CmdId 22960
message GetCityHuntingOfferRsp {
  HuntingPair ongoing_hunting_pair = 2;
  int32 retcode = 3;
  uint32 city_id = 4;
  repeated HuntingOfferData hunting_offer_list = 9;
  uint32 cur_week_finished_count = 11;
  uint32 next_refresh_time = 14;
}
