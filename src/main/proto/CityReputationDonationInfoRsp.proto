syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CityReputationDonationInfoRspOuterClass";
import "BAJPGKGFGMH.proto";

// 7.2 CmdId 20272
message CityReputationDonationInfoRsp {
  uint32 total_accept_request_num = 1;
