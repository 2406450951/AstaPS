enum PlayerLogoutReq__Reason {
  PLAYER_LOGOUT_REQ__REASON_DISCONNECT = 0;
  PLAYER_LOGOUT_REQ__REASON_CLIENT_REQ = 1;
  PLAYER_LOGOUT_REQ__REASON_TIMEOUT = 2;
  PLAYER_LOGOUT_REQ__REASON_ADMIN_REQ = 3;
  PLAYER_LOGOUT_REQ__REASON_SERVER_CLOSE = 4;
  PLAYER_LOGOUT_REQ__REASON_GM_CLEAR = 5;
  PLAYER_LOGOUT_REQ__REASON_PLAYER_TRANSFER = 6;
  PLAYER_LOGOUT_REQ__REASON_CLIENT_CHECKSUM_INVALID = 7;
  PLAYER_LOGOUT_REQ__REASON_MUIP_MOVE_SAVE_WAIT = 8;
  PLAYER_LOGOUT_REQ__REASON_ASYNC_ADMIN_REQ = 9;
