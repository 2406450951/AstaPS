syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CoinCollectStageInfoOuterClass";
import "CoinCollectPlayerInfo.proto";

message CoinCollectStageInfo {
  uint32 play_index = 1;
  uint32 level_id = 2;
  repeated CoinCollectPlayerInfo player_info_list = 3;
}
