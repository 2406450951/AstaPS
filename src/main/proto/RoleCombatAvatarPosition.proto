syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatAvatarPositionOuterClass";
import "_AvatarMirrorType.proto";

message RoleCombatAvatarPosition {
  uint32 costume_id = 3;
  uint32 avatar_id = 4;
  _AvatarMirrorType avatar_type = 5;
  uint32 point_id = 6;
}
