syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BCANJCKIFNDOuterClass";
message BCANJCKIFND {
  uint32 uid = 1;
  uint32 cur_score = 2;
  uint32 EPIPKHOFIHJ = 3;
  uint32 _max_combo_num = 4;
  sfixed64 IJGHLJKIJFM = 5;
  sfixed64 EEKABNHAKEB = 6;
  sfixed64 BCOJOCGGJML = 7;
  uint32 kill_num = 8;
}
