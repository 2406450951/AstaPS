syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGWeekChallengeInfoNotifyOuterClass";
import "GCGWeekChallengeInfo.proto";
import "ItemParam.proto";

// 7.2 CmdId 9792
message GCGWeekChallengeInfoNotify {
  repeated ItemParam MNMHAIGPNIF = 4;
  repeated GCGWeekChallengeInfo challenge_info_list = 7;
  bool is_notify_npc_change = 10;
  uint32 next_refresh_time = 14;
  uint32 GDEGEDFBKJN = 15;
}
