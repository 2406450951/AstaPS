syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WindSeedClientNotifyOuterClass";
import "AddWindBulletNotify.proto";
import "AreaNotify.proto";
import "RefreshNotify.proto";

// 7.2 CmdId 21144
message WindSeedClientNotify {
  oneof KAOPEKHIELG {
    RefreshNotify RefreshNotify = 6;
    AddWindBulletNotify AddWindBulletNotify = 7;
    AreaNotify AreaNotify = 8;
  }
}
