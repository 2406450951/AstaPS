syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ToTheMoonObstaclesModifyNotifyOuterClass";
import "ToTheMoonObstacleInfo.proto";

// 7.2 CmdId 6108
message ToTheMoonObstaclesModifyNotify {
  uint32 scene_id = 1;
  repeated int32 remove_obstacle_ids = 6;
  repeated ToTheMoonObstacleInfo add_obstacles = 9;
  bool use_edge = 10;
}
