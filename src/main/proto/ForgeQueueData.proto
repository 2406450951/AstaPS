syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message ForgeQueueData {
  uint32 next_finish_timestamp = 20000;
  uint32 finish_count = 3;
  uint32 unfinish_count = 20001;
  uint32 queue_id = 20002;
  uint32 avatar_id = 9;
  uint32 total_finish_timestamp = 20003;
  uint32 forge_id = 2;
}
