syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "Vector.proto";

message OneoffGatherPointDetectorData {
  Vector hint_center_pos = 12;
  uint32 material_id = 9;
  uint32 scene_id = 4;
  uint32 CBENILCDDCB = 20000;
  uint32 config_id = 8;
  uint32 _map_layer_id = 7;
  uint32 group_id = 5;
  uint32 hint_radius = 11;
  bool is_all_collected = 15;
  bool is_hint_valid = 3;
}
