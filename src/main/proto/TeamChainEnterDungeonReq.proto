syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TeamChainEnterDungeonReqOuterClass";
import "TeamChainChooseTeamInfo.proto";

message TeamChainEnterDungeonReq {
  uint32 stage_id = 1;
  uint32 difficulty = 2;
  repeated TeamChainChooseTeamInfo team_info_list = 3;
}
