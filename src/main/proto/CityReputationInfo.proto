syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CityReputationInfoOuterClass";
import "CityReputationExploreInfo.proto";
import "CityReputationHuntInfo.proto";
import "CityReputationQuestInfo.proto";
import "CityReputationRequestInfo.proto";

message CityReputationInfo {
  uint32 _transform_level_reward_list = 2;
  repeated uint32 HAAKLLMBDBK = 3;
  uint32 next_refresh_time = 4;
  repeated uint32 taken_level_reward_list = 5;
  uint32 exp = 6;
  CityReputationRequestInfo request_info = 7;
  CityReputationExploreInfo explore_info = 8;
  CityReputationQuestInfo quest_info = 10;
  uint32 total_accept_request_num = 11;
  uint32 level = 12;
  CityReputationHuntInfo hunt_info = 13;
}
