syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_AddInfoOuterClass";
import "LIJBINOALHC.proto";
import "Vector.proto";

message _AddInfo {
  Vector start_pos = 1;
  Vector IDCPGGILMBC = 3;
  int32 NGOBCDCBOBC = 4;
  int32 BOMPKGHABBI = 6;
  int32 area = 10;
  int32 id = 11;
  LIJBINOALHC EIPJDIBICMO = 12;
  int32 width = 13;
}
