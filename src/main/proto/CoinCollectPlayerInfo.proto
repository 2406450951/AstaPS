syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CoinCollectPlayerInfoOuterClass";
import "CoinCollectTeamAvatarInfo.proto";

message CoinCollectPlayerInfo {
  uint32 player_uid = 1;
  uint32 choose_skill_no = 2;
  bool is_prepare = 3;
  string player_name = 4;
  repeated CoinCollectTeamAvatarInfo avatar_info_list = 5;
}
