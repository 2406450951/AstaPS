syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtEntityStartDieEndNotifyOuterClass";
import "ForwardType.proto";

// 7.2 CmdId 135
message EvtEntityStartDieEndNotify {
  ForwardType forward_type = 1;
  uint32 entity_id = 4;
  uint32 die_state_flag = 9;
  bool immediately = 13;
}
