syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LeyLineChallengePlayerOuterClass";
import "ProfilePicture.proto";

message LeyLineChallengePlayer {
  string _xbox_gamertag = 1;
