syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ReunionWatcherInfoOuterClass";
message ReunionWatcherInfo {
  uint32 watcher_id = 6;
  uint32 total_progress = 9;
  uint32 reward_unlock_time = 10;
  uint32 cur_progress = 13;
  bool is_taken_reward = 15;
}
