syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "EMEJENPCHLO.proto";
import "MathQuaternion.proto";
import "PHCHPFLPIFL.proto";
import "Vector.proto";

message RoutePoint {
  enum IGDEDOLNAKF {
    IGDEDOLNAKF_KEEP_MOVE = 0;
    IGDEDOLNAKF_TELEPORT_BY_OBSTACLE = 1;
    IGDEDOLNAKF_FADE_IN_OUT_TELEPORT_BY_OBSTACLE = 2;
  }
  EMEJENPCHLO action = 25;
  Vector position = 1;
  RoutePoint.IGDEDOLNAKF LNDBCAEOICD = 30;
  uint32 EIHOHLKAHMF = 27;
  float arrive_range = 2;
  bool MGNMPMKHHEI = 29;
  bool PLKKAGBMEHC = 28;
  bool OJHGMEPOMPO = 26;
  bool has_reach_event = 3;
  int32 speed_level = 4;
  PHCHPFLPIFL point_type = 24;
  oneof rotate_params {
    Vector rotation = 21;
    MathQuaternion rotation_speed = 22;
    MathQuaternion axis_speed = 23;
  }
  oneof move_params {
    float velocity = 11;
    float time = 12;
  }
}
