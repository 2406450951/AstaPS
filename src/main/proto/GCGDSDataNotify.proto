syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGDSDataNotifyOuterClass";
import "GCGDSCardData.proto";
import "GCGDSDeckData.proto";

// 7.2 CmdId 24479
message GCGDSDataNotify {
  repeated GCGDSCardData card_list = 3;
  repeated uint32 ICFNEPCDACO = 6;
  uint32 cur_deck_id = 10;
  repeated GCGDSDeckData deck_list = 11;
  repeated uint32 ONJMNKKNEJN = 14;
  repeated uint32 GJEGGIACDGB = 15;
}
