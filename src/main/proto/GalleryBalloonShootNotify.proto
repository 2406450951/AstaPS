syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GalleryBalloonShootNotifyOuterClass";
message GalleryBalloonShootNotify {
  uint32 gallery_id = 1;
  int32 add_score = 2;
  uint32 combo = 3;
  uint64 combo_disable_time = 4;
  uint32 cur_score = 5;
  uint32 trigger_entity_id = 6;
}
