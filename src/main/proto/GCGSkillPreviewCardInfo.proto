syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGSkillPreviewCardInfoOuterClass";
import "GCGZoneType.proto";

message GCGSkillPreviewCardInfo {
  uint32 face_type = 3;
  uint32 controller_id = 6;
  uint32 card_guid = 7;
  uint32 card_id = 8;
  GCGZoneType zone_type = 9;
  uint32 LABHEGKBFPG = 13;
  uint32 owner_card_guid = 14;
}
