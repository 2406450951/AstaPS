syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "ShapeBox.proto";
import "ShapeSphere.proto";

message MassiveEntityElementOpBatchNotify {
  uint32 user_id = 20000;
  float attack_element_durability = 15;
  uint32 op_idx = 20001;
  int32 source_element_type = 20002;
  int32 reaction_source_type = 20003;
  int32 entity_type = 2;
  uint32 attacker_id = 13;
  oneof check_shape {
    ShapeSphere shape_sphere = 12;
    ShapeBox shape_box = 14;
  }
}
