syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_CustomGalleryTargetNotifyOuterClass";
// 7.2 CmdId 20284
message _CustomGalleryTargetNotify {
  uint32 gallery_id = 2;
  repeated uint32 value_list = 9;
  repeated uint32 AIPBGJILDPO = 13;
  repeated uint32 uid_list = 14;
  uint32 target_id = 15;
}
