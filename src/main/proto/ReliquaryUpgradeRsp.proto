syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message ReliquaryUpgradeRsp {
  repeated uint32 old_append_prop_list = 20000;
  repeated uint32 cur_append_prop_list = 20001;
  uint32 power_up_rate = 14;
  uint32 old_level = 7;
  uint32 cur_level = 15;
  int32 retcode = 9;
  uint64 target_reliquary_guid = 11;
}
