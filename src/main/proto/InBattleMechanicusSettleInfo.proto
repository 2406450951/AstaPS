syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InBattleMechanicusSettleInfoOuterClass";
import "MultistageSettleWatcherInfo.proto";

message InBattleMechanicusSettleInfo {
  repeated MultistageSettleWatcherInfo watcher_list = 2;
  uint32 play_index = 4;
  bool is_success = 8;
  uint32 group_id = 9;
  uint64 scene_time_ms = 10;
  uint32 MIPPHBLHBAB = 12;
  uint32 HGMDFEEDFGB = 13;
  uint32 MAEOKPFPGAA = 15;
}
