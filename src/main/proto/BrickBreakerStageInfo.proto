syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BrickBreakerStageInfoOuterClass";
import "BrickBreakerPlayerBattleInfo.proto";
import "BrickBreakerStageType.proto";

message BrickBreakerStageInfo {
  BrickBreakerStageType stage_type = 8;
  repeated BrickBreakerPlayerBattleInfo battle_info_list = 13;
  uint32 level_id = 14;
}
