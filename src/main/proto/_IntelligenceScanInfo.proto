syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_IntelligenceScanInfoOuterClass";
import "_IntelligenceScanData.proto";

message _IntelligenceScanInfo {
  uint32 next_refresh_time = 4;
  uint32 _current_scans = 7;
  uint32 _max_scans = 8;
  repeated _IntelligenceScanData _intelligence_scan_data_list = 9;
  repeated uint32 _bought_goods_id_list = 14;
}
