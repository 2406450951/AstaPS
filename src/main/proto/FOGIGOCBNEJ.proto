syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FOGIGOCBNEJOuterClass";
import "GOIMIPIPCDN.proto";
import "HEJFACPFJCF.proto";

message FOGIGOCBNEJ {
  uint32 guid = 1;
  GOIMIPIPCDN EGLBMKBLDDL = 2;
  oneof detail {
    HEJFACPFJCF MapImage = 100;
  }
}
