syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AvatarExpeditionInfo.proto";
import "_AvatarExpeditionRewardInfo.proto";

message AvatarExpeditionGetRewardRsp {
  repeated _AvatarExpeditionRewardInfo _expedition_reward_list = 14;
  map<uint64, AvatarExpeditionInfo> expedition_info_map = 9;
  repeated int32 ANAMNOCEICO = 5;
  int32 retcode = 11;
}
