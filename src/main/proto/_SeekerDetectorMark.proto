syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SeekerDetectorMarkOuterClass";
import "Vector.proto";
import "_SeekerDetectorKey.proto";

message _SeekerDetectorMark {
  Vector _mark_pos = 3;
  uint32 _mark_map_layer_id = 7;
  _SeekerDetectorKey key = 10;
  uint32 _widget_seeker_id = 15;
}
