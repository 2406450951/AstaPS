syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_NatlanDrillCollectSettleInfoOuterClass";
message _NatlanDrillCollectSettleInfo {
  uint32 KIDFFKNIAHK = 1;
  uint32 reason = 2;
  uint32 HCNIACOILOE = 3;
  uint32 _left_hp = 4;
  uint32 collect_num = 5;
  uint32 use_time = 9;
  bool is_new_record = 11;
  bool is_succ = 12;
  uint32 score = 14;
  uint32 NFNIDHCPOII = 15;
}
