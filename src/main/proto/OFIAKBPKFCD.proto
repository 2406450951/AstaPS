syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OFIAKBPKFCDOuterClass";
import "JKKANLOJNHI.proto";
import "_AchievementData.proto";
import "_CustomData.proto";
import "_DlcData.proto";
import "_LevelObjectiveData.proto";
import "_TierData.proto";

message OFIAKBPKFCD {
  uint32 id = 1;
  JKKANLOJNHI JGCJGIABEHG = 2;
  oneof detail {
    _CustomData CustomData = 100;
    _TierData TierData = 101;
    _AchievementData AchievementData = 102;
    _DlcData DlcData = 103;
    _LevelObjectiveData LevelObjectiveData = 104;
  }
}
