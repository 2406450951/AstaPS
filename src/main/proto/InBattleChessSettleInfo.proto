syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InBattleChessSettleInfoOuterClass";
import "ExhibitionDisplayInfo.proto";

message InBattleChessSettleInfo {
  bool is_success = 1;
  repeated ExhibitionDisplayInfo score_list = 2;
  uint32 OEHNFEEBKNB = 3;
  uint32 BNFCJGGOIBO = 4;
  uint32 IJKDPOHDAKN = 5;
  uint32 ODAHDBACAOB = 6;
  uint64 scene_time_ms = 7;
}
