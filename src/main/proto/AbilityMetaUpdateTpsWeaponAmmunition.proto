syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "TpsAmmunitionChange.proto";
import "TpsAmmunitionUpdateType.proto";
import "TpsWeaponAccessoryInfo.proto";

message AbilityMetaUpdateTpsWeaponAmmunition {
  TpsAmmunitionUpdateType update_type = 8;
  bool FENKFADBDID = 20000;
  repeated TpsWeaponAccessoryInfo accessory_list = 15;
  repeated TpsAmmunitionChange ammunition_list = 2;
}
