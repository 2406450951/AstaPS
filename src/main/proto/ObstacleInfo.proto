syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ObstacleInfoOuterClass";
import "LIJBINOALHC.proto";
import "MathQuaternion.proto";
import "ObstacleInfo__ShapeType.proto";
import "Vector.proto";
import "Vector3Int.proto";

message ObstacleInfo {
  MathQuaternion rotation = 1;
  ObstacleInfo__ShapeType shape = 4;
  LIJBINOALHC EIPJDIBICMO = 6;
  int32 obstacle_id = 9;
  Vector center = 10;
  Vector3Int extents = 13;
}
