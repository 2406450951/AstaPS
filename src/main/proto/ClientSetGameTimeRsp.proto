syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ClientSetGameTimeRspOuterClass";

message ClientSetGameTimeRsp {
  repeated uint32 game_time_locked_quest_list = 5;
  uint32 game_time = 4;
  uint32 client_game_time = 20000;
  int32 retcode = 8;
}
