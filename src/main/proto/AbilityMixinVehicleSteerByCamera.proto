syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinVehicleSteerByCameraOuterClass";
import "Vector.proto";

message AbilityMixinVehicleSteerByCamera {
  Vector ref_pos = 4;
  uint32 ref_id = 5;
  Vector target_dir = 8;
  Vector target_pos = 13;
  uint32 KMMLNDMEIDD = 14;
}
