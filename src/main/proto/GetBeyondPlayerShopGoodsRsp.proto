syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetBeyondPlayerShopGoodsRspOuterClass";
import "ShopGoods.proto";

// 7.2 CmdId 1361
message GetBeyondPlayerShopGoodsRsp {
