syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AvatarExpeditionInfo.proto";
import "_AvatarExpeditionBasicInfo.proto";

message AvatarExpeditionStartRsp {
  repeated _AvatarExpeditionBasicInfo _expedition_basic_info_list = 10;
  repeated int32 ILBIKNLHAKE = 20000;
  map<uint64, AvatarExpeditionInfo> expedition_info_map = 8;
  int32 retcode = 3;
}
