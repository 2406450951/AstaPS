syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinAvatarSteerByCameraOuterClass";
import "Vector.proto";

message AbilityMixinAvatarSteerByCamera {
  uint32 layer = 1;
  Vector target_pos = 4;
  Vector ref_pos = 7;
  Vector target_dir = 8;
  uint32 ref_id = 12;
}
