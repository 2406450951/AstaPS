syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BirdBallSettleInfoOuterClass";
import "ExhibitionDisplayInfo.proto";

message _BirdBallSettleInfo {
  uint32 level_id = 1;
  uint32 use_time = 2;
  uint32 score = 3;
  uint32 OPKNDIJDPFL = 4;
  repeated ExhibitionDisplayInfo MDKCCJCHOAF = 5;
  uint32 IJLNIABJFBH = 6;
  uint32 PBPDHNJMPJL = 7;
  bool is_new_record = 8;
  bool _is_interrupt = 9;
}
