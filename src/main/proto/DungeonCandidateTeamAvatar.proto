syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DungeonCandidateTeamAvatarOuterClass";
import "AvatarInfo.proto";
import "_UgcDungeonAvatarInfo.proto";

message DungeonCandidateTeamAvatar {
  uint32 player_uid = 5;
  AvatarInfo avatar_info = 14;
  oneof detail {
    _UgcDungeonAvatarInfo UgcAvatarInfo = 1978;
  }
}
