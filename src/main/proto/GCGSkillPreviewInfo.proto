syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGSkillPreviewInfoOuterClass";
import "GCGSkillPreviewCardInfo.proto";
import "GCGSkillPreviewElementReactionInfo.proto";
import "GCGSkillPreviewExtraInfo.proto";
import "GCGSkillPreviewHpInfo.proto";
import "GCGSkillPreviewOnstageChangeInfo.proto";
import "GCGSkillPreviewTokenChangeInfo.proto";
import "POPPHDOEFLC.proto";

message GCGSkillPreviewInfo {
  uint32 skill_id = 2;
  repeated GCGSkillPreviewCardInfo HDLHLNNMPOK = 4;
  map<uint32, POPPHDOEFLC> KHLNLJCLGCD = 5;
  map<uint32, GCGSkillPreviewTokenChangeInfo> card_token_change_map = 7;
  repeated GCGSkillPreviewOnstageChangeInfo change_onstage_character_list = 8;
  uint32 KPJOCKAOOLM = 9;
  GCGSkillPreviewExtraInfo extra_info = 10;
  repeated GCGSkillPreviewCardInfo DPKFAMGEGCK = 11;
  map<uint32, GCGSkillPreviewElementReactionInfo> reaction_info_map = 12;
  map<uint32, GCGSkillPreviewHpInfo> hp_info_map = 14;
}
