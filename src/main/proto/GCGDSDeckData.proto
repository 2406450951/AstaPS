syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGDSDeckDataOuterClass";
message GCGDSDeckData {
  bool is_valid = 1;
  repeated uint32 character_card_list = 2;
  uint32 MINJJFHANLK = 3;
  string name = 6;
  repeated uint32 card_list = 10;
  uint32 OCEFPDNDJJA = 12;
  fixed32 create_time = 14;
  uint32 id = 15;
}
