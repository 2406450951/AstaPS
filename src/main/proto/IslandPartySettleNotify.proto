syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "IslandPartySettleNotifyOuterClass";
import "ExhibitionDisplayInfo.proto";
import "GalleryStopReason.proto";
import "IslandPartyGallerySettleInfo.proto";

message IslandPartySettleNotify {
  repeated ExhibitionDisplayInfo score_list = 1;
  repeated IslandPartyGallerySettleInfo settle_info_list = 2;
  bool is_new_record = 3;
  uint32 time_remain = 4;
  GalleryStopReason reason = 5;
}
