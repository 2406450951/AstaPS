syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGSettleNotifyOuterClass";
import "GCGEndReason.proto";
import "GCGGameBusinessType.proto";
import "ItemParam.proto";
import "OGMCGAHGJPO.proto";
import "_GCGArenaSettle.proto";
import "_GCGAutoBattleCardActivitySettle.proto";
import "_GCGPveActivitySettle.proto";
import "_GCGPveInfiniteActivitySettle.proto";

// 7.2 CmdId 2722
message GCGSettleNotify {
  repeated uint32 finished_challenge_id_list = 3;
  uint32 win_controller_id = 6;
  GCGGameBusinessType business_type = 8;
  GCGEndReason reason = 9;
  bool is_win = 10;
  repeated uint32 forbid_finish_challenge_list = 12;
  OGMCGAHGJPO POGNAHFCFOA = 13;
  repeated ItemParam reward_item_list = 14;
  uint32 game_id = 15;
  oneof detail {
    _GCGPveInfiniteActivitySettle PveInfiniteActivitySettle = 188;
    _GCGArenaSettle ArenaSettle = 512;
    _GCGPveActivitySettle PveActivitySettle = 1481;
    _GCGAutoBattleCardActivitySettle AutoBattleCardActivitySettle = 1843;
  }
}
