syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FBNHJECABADOuterClass";
import "AIGPDGJECHI.proto";
import "FABPMAGAGIP.proto";
import "HHEDHCFPEKM.proto";
import "IAFLDFNPALC.proto";

message FBNHJECABAD {
  AIGPDGJECHI KGIMKCOENCP = 1;
  float OKGCNFPMKCE = 2;
  HHEDHCFPEKM pos = 3;
  HHEDHCFPEKM rot = 4;
  uint32 data_version = 5;
  oneof detail {
    IAFLDFNPALC PointLightConfig = 51;
    FABPMAGAGIP SpotLightConfig = 52;
  }
}
