message PlayerEyePointStateNotify {
  bool is_use_eye_point = 7;
  Vector eye_point_pos = 9;
  bool is_filter_stream_pos = 10;
  int32 fix_lod_level = 11;
  uint32 AIDJGDLFKJG = 12;
  uint32 JBDNLMPJGMK = 13;
  uint32 AMHCJKDPJAG = 14;
  uint32 NHNIONBMJEM = 15;
  oneof NDAPAAPCLJE {
    CylinderRegionSize CylinderSize = 198;
    Vector CubicSize = 322;
    float SphereRadius = 458;
    PolygonRegionSize PolygonSize = 1040;
