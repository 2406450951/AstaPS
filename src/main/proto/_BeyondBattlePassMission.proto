syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "CBNPFLLFAJG.proto";

message _BeyondBattlePassMission {
  enum _BeyondMissionStatus {
    _BeyondMissionStatus_MISSION_INVALID = 0;
    _BeyondMissionStatus_MISSION_UNFINISHED = 1;
    _BeyondMissionStatus_MISSION_FINISHED = 2;
    _BeyondMissionStatus_MISSION_POINT_TAKEN = 3;
  }
  CBNPFLLFAJG extra_info = 14;
  uint32 cur_progress = 12;
  uint32 mission_type = 7;
  uint32 total_progress = 5;
  uint32 reward_battle_pass_point = 2;
  _BeyondBattlePassMission._BeyondMissionStatus mission_status = 9;
  uint32 mission_id = 1;
}
