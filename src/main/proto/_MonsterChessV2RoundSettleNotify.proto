syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_MonsterChessV2RoundSettleNotifyOuterClass";
// 7.2 CmdId 6818
message _MonsterChessV2RoundSettleNotify {
  bool _is_enter_infinite = 2;
  bool is_win = 4;
  bool _is_infinite = 7;
  repeated uint32 _win_round_list = 10;
  uint32 _infinite_win_num = 14;
  uint32 _cur_round_num = 15;
}
