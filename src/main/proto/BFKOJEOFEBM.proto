syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BFKOJEOFEBMOuterClass";
import "AIGPDGJECHI.proto";
import "BCIDNJALEEI.proto";
import "HFDCCNKGNBL.proto";
import "HHEDHCFPEKM.proto";

message BFKOJEOFEBM {
  AIGPDGJECHI KGIMKCOENCP = 1;
  float OKGCNFPMKCE = 2;
  HHEDHCFPEKM pos = 3;
  HHEDHCFPEKM rot = 4;
  uint32 data_version = 5;
  bool LCLHGOADFAJ = 501;
  oneof detail {
    BCIDNJALEEI PointLightConfig = 51;
    HFDCCNKGNBL SpotLightConfig = 52;
  }
}
