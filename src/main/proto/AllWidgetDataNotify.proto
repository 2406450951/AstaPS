syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AnchorPointData.proto";
import "ClientCollectorData.proto";
import "LunchBoxData.proto";
import "OneoffGatherPointDetectorData.proto";
import "SkyCrystalDetectorData.proto";
import "Uint32Pair.proto";
import "WeatherWizardData.proto";
import "WidgetCoolDownData.proto";
import "WidgetSlotData.proto";
import "_SorushWidgetData.proto";
import "_TreasureKeyData.proto";
import "_WispCageData.proto";

message AllWidgetDataNotify {
  repeated Uint32Pair _widget_setting_list = 601;
  LunchBoxData lunch_box_data = 15;
  _TreasureKeyData _treasure_key_data = 553;
  repeated Uint32Pair _anchor_point_material_next_usable_time_list = 696;
  repeated AnchorPointData anchor_point_list = 11;
  repeated uint32 background_active_widget_list = 14;
  repeated WidgetSlotData slot_list = 3;
  repeated uint32 _material_id_list = 1931;
  _SorushWidgetData _sorush_widget_data = 8;
  SkyCrystalDetectorData sky_crystal_detector_data = 5;
  WeatherWizardData weather_wizard_data = 12;
  repeated ClientCollectorData client_collector_data_list = 2;
  repeated WidgetCoolDownData normal_cool_down_data_list = 13;
  repeated WidgetCoolDownData cool_down_group_data_list = 9;
  repeated OneoffGatherPointDetectorData oneoff_gather_point_detector_data_list = 10;
  _WispCageData _wisp_cage_data = 1839;
  uint32 _current_slot_num = 340;
}
