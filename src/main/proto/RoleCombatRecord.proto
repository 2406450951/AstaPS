syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatRecordOuterClass";
import "EDDCJOBDINO.proto";
import "RoleCombatFinishedLevelInfo.proto";
import "Uint32Pair.proto";

message RoleCombatRecord {
  uint32 GANOHGNGMEA = 1;
  repeated RoleCombatFinishedLevelInfo finished_level_list = 2;
  repeated uint32 MENJJLDBJHM = 3;
  repeated uint32 JEOFFBPPGPA = 4;
  Uint32Pair KAPLINDLKIF = 5;
  Uint32Pair ELKJFECKJOP = 6;
  uint32 difficulty_id = 7;
  uint32 HHFOGLOHHDI = 8;
  repeated Uint32Pair CFODPHOOBGN = 9;
  Uint32Pair MKIFFPBJKOM = 10;
  uint32 HKMCIEFGEKE = 11;
  uint32 JLGHKLFFBID = 12;
  repeated EDDCJOBDINO CMJFKLJKOJN = 14;
  repeated uint32 KIHNFPGNLEK = 15;
}
