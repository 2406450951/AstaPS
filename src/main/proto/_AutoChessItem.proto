syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_AutoChessItemOuterClass";
import "_AutoChessChess.proto";
import "_AutoChessCounter.proto";
import "_AutoChessEquip.proto";

message _AutoChessItem {
  oneof detail {
    _AutoChessCounter Counter = 3;
    _AutoChessEquip Equip = 4;
    _AutoChessChess Chess = 9;
  }
}
