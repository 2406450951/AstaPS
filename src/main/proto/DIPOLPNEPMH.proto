syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DIPOLPNEPMHOuterClass";
enum DIPOLPNEPMH {
  DIPOLPNEPMH_NONE = 0;
  DIPOLPNEPMH_UINT = 1;
  DIPOLPNEPMH_INT = 2;
  DIPOLPNEPMH_BOOL = 3;
  DIPOLPNEPMH_FLOAT = 4;
  DIPOLPNEPMH_STRING = 5;
  DIPOLPNEPMH_ENUM = 6;
  DIPOLPNEPMH_OBJECT = 7;
}
