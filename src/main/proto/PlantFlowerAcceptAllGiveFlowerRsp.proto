syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlantFlowerAcceptAllGiveFlowerRspOuterClass";
import "PlantFlowerAcceptFlowerResultInfo.proto";

message PlantFlowerAcceptAllGiveFlowerRsp {
  int32 retcode = 1;
  uint32 schedule_id = 2;
  repeated PlantFlowerAcceptFlowerResultInfo accept_flower_result_info_list = 3;
}
