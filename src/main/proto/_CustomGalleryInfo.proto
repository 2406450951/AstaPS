syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_CustomGalleryInfoOuterClass";
import "_CustomGalleryProgressInfo.proto";
import "_CustomGalleryScoreBoardInfo.proto";

message _CustomGalleryInfo {
  repeated uint32 _modified_progress_id_list = 1;
  repeated _CustomGalleryProgressInfo _progress_list = 2;
  repeated _CustomGalleryScoreBoardInfo _score_board_list = 4;
  bool _is_need_update = 5;
}
