syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_GCGMsgTransferCardToOpponentOuterClass";
import "GCGReason.proto";
import "GCGZoneType.proto";
import "MFHAJGBGHBN.proto";

message _GCGMsgTransferCardToOpponent {
  repeated MFHAJGBGHBN JGHJDOCGEFA = 2;
  GCGReason reason = 3;
  GCGZoneType zone_type = 10;
}
