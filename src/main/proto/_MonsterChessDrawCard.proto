syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_MonsterChessDrawCardOuterClass";
message _MonsterChessDrawCard {
  uint32 JCKLGBFECHI = 1;
  uint32 _card_base_level = 2;
  uint32 card_id = 4;
  uint32 DGLIHAPCPGF = 12;
  uint32 extra_level = 13;
}
