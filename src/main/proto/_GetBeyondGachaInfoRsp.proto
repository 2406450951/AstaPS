syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_GetBeyondGachaInfoRspOuterClass";
import "BeyondGachaTypeState.proto";
import "_BeyondGachaInfo.proto";

// 7.2 CmdId 8892
message _GetBeyondGachaInfoRsp {
  uint32 verify_code = 3;
  bool is_under_minors_restrict = 6;
  bool is_under_general_restrict = 11;
  BeyondGachaTypeState gacha_type_state = 13;
  int32 retcode = 14;
  repeated _BeyondGachaInfo _beyond_gacha_info_list = 15;
}
