syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ActivityRecvGiftDataOuterClass";
import "ProfilePicture.proto";

message ActivityRecvGiftData {
  ProfilePicture profile_picture = 2;
  fixed64 accept_time = 3;
  bool _is_gift_received = 6;
  string nickname = 11;
  fixed64 _recv_time = 12;
  map<uint32, uint32> gift_num_map = 13;
  uint32 uid = 14;
  string remark_name = 15;
}
