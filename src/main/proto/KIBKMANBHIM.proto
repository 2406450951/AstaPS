syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "KIBKMANBHIMOuterClass";
import "BKMHDOFHPHM.proto";
import "DIHKBFBDDLH.proto";
import "DNPFEFPEFNK.proto";
import "ECOAHFBLIFJ.proto";
import "GKHPADDFLDK.proto";
import "HMDDOKBLJOA.proto";
import "JMALLLDEFOE.proto";

message KIBKMANBHIM {
  int32 DFICKOMODDI = 501;
  oneof detail {
    BKMHDOFHPHM PlayerHp = 11;
    HMDDOKBLJOA SkillArea = 12;
    GKHPADDFLDK TeamAndFaction = 13;
    DNPFEFPEFNK MiniMap = 14;
    ECOAHFBLIFJ NoneIntrinsicUi = 15;
    DIHKBFBDDLH BasicActiveControl = 16;
    JMALLLDEFOE ClientUi = 17;
  }
}
