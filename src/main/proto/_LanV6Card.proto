syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanV6CardOuterClass";
import "Vector.proto";
import "_LanV6CardSocial.proto";
import "_LanV6CardSource.proto";
import "_LanV6LanternDetail.proto";

message _LanV6Card {
  uint32 scene_id = 1;
  uint32 target_uid = 2;
  fixed32 _sent_time = 3;
  fixed64 guid = 4;
  _LanV6CardSocial _card_social = 5;
  Vector pos = 8;
  Vector rot = 9;
  bool is_liked = 11;
  uint32 gadget_id = 12;
  _LanV6CardSource _card_source = 14;
  oneof detail {
    _LanV6LanternDetail LanV6Lantern = 8614;
  }
}
