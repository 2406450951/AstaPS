syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InstableSprayLevelFinishNotifyOuterClass";
message InstableSprayLevelFinishNotify {
  uint32 stage_id = 1;
  uint32 round = 2;
  uint32 level_id = 3;
  bool is_skip_black_screen = 4;
  bool FDOMKFDKAIP = 5;
  uint32 difficulty = 6;
  repeated uint32 score_list = 7;
}
