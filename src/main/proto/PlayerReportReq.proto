syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerReportReqOuterClass";
import "ReportReasonType.proto";
import "_ReportReasonSubtype.proto";

// 7.2 CmdId 27416
message PlayerReportReq {
  string target_home_module_name = 2;
  _ReportReasonSubtype _sub_reason = 4;
  uint32 target_uid = 5;
  string content = 10;
  uint32 target_home_module_id = 14;
  ReportReasonType reason = 15;
}
