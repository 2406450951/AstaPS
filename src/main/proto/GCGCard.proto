syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGCardOuterClass";
import "GCGSkillLimitsInfo.proto";
import "GCGToken.proto";

message GCGCard {
  repeated uint32 EEGIMPFLDNF = 2;
  repeated uint32 tag_list = 5;
  uint32 face_type = 6;
  uint32 KGLJPAMHCMK = 7;
  bool is_show = 8;
  repeated GCGSkillLimitsInfo skill_limits_list = 9;
  uint32 id = 10;
  uint32 IGFJIAHJDEA = 11;
  uint32 controller_id = 12;
  uint32 guid = 13;
  repeated uint32 skill_id_list = 14;
  repeated GCGToken token_list = 15;
}
