syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GroupLinkBundleOuterClass";
import "Vector.proto";
import "_GroupLinkShowAreaState.proto";

message GroupLinkBundle {
  bool is_activated = 1;
  uint32 bundle_id = 5;
  _GroupLinkShowAreaState _show_area_state = 7;
  Vector center = 9;
  uint32 radius = 10;
  uint32 _map_layer_id = 12;
  bool is_show_mark = 14;
  uint32 scene_id = 15;
}
