syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtSyncTransformOuterClass";
import "Vector.proto";
import "VineManRunPlatformInfo.proto";

message EvtSyncTransform {
  Vector entity_pos = 2;
  uint32 entity_id = 6;
  VineManRunPlatformInfo vine_man_run_platform = 13;
  Vector entity_rot = 14;
}
