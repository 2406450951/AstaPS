syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EntityJumpNotifyOuterClass";
import "Type.proto";
import "Vector.proto";

// 7.2 CmdId 24309
message EntityJumpNotify {
  uint32 entity_id = 3;
  Vector rot = 10;
  Vector pos = 11;
  Type jump_type = 15;
}
