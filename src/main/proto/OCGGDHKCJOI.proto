syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OCGGDHKCJOIOuterClass";
message OCGGDHKCJOI {
  uint32 costume_id = 2;
  uint32 GECBAHPPMDI = 5;
  uint32 uid = 9;
  uint32 JCPNFEFNHCF = 10;
  uint32 avatar_id = 11;
  string nickname = 12;
  uint32 CKMPIKBPFJP = 13;
  bool is_ready = 14;
}
