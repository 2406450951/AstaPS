option java_outer_classname = "TowerBriefDataNotifyOuterClass";
// 7.2 CmdId 8853
message TowerBriefDataNotify {
  uint32 schedule_start_time = 4;
  uint32 last_level_index = 5;
  uint32 GJJENPIMCAB = 6;
