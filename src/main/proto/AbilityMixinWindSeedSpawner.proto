syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinWindSeedSpawnerOuterClass";
import "AddSignal.proto";
import "CatchSeed.proto";
import "RefreshSeed.proto";

message AbilityMixinWindSeedSpawner {
  oneof CNEMOHIABEG {
    AddSignal AddSignal = 2;
    RefreshSeed RefreshSeed = 9;
    CatchSeed CatchSeed = 14;
  }
}
