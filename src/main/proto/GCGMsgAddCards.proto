syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGMsgAddCardsOuterClass";
import "GCGReason.proto";
import "GCGZoneType.proto";

message GCGMsgAddCards {
  GCGReason reason = 6;
  GCGZoneType zone = 7;
  uint32 pos = 9;
  repeated uint32 card_guid_list = 11;
  uint32 controller_id = 12;
}
