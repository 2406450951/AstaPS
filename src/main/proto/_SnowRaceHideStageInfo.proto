syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SnowRaceHideStageInfoOuterClass";
import "_SnowRaceHidePlayerBattleInfo.proto";

message _SnowRaceHideStageInfo {
  bool is_record_score = 3;
  repeated uint32 hider_uid_list = 9;
  uint32 hunter_uid = 11;
  uint32 map_id = 12;
  repeated _SnowRaceHidePlayerBattleInfo DIKOGDFGHJP = 13;
}
