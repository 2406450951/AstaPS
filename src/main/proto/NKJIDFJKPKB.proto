syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "NKJIDFJKPKBOuterClass";
import "ProfilePicture.proto";

message NKJIDFJKPKB {
  string nickname = 2;
  uint32 uid = 3;
  uint32 like_num = 9;
  fixed64 guid = 13;
  ProfilePicture profile_picture = 15;
}
