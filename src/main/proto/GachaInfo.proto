syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaInfoOuterClass";

import "GachaUpInfo.proto";

// 7.2 corrections from the NT dump. The NT names left_gacha_times = 8, title_textmap = 366,
// gacha_record_url_oversea = 414 and wish_item_id_list = 1779 (the Chronicled Wish choices).
// ELHMLLLJKGC (12) is ten_cost_item_id and NBFNKAHGNGJ (2039) cur_schedule_daily_gacha_times:
// NT reuses those obfuscated names in DoGachaRsp, where 7.1 had the named fields. The two
// unnamed bools 514 and 1859 take is_new_wish and HMOJLEMLHDK, which the server sets together.
message GachaInfo {
  string gacha_preview_prefab_path = 11;
  uint32 ten_cost_item_id = 12;
  uint32 gacha_type = 5;
  uint32 begin_time = 10;
  uint32 schedule_id = 4;
  uint32 left_gacha_times = 8;
  uint32 ten_cost_item_num = 1;
  uint32 gacha_times_limit = 15;
  uint32 cost_item_id = 13;
  string gacha_record_url = 7;
  uint32 cost_item_num = 3;
  string gacha_prob_url = 9;
  string gacha_prefab_path = 14;
  uint32 end_time = 6;
  uint32 gacha_sort_id = 2;
  repeated uint32 display_chronicle_5_item_list = 1779;
  bool HMOJLEMLHDK = 1859;
  repeated uint32 display_up4_item_list = 57;
  bool is_new_wish = 514;
  repeated uint32 display_up5_item_list = 856;
  string gacha_record_url_oversea = 414;
  string gacha_prob_url_oversea = 1518;
  string title_textmap = 366;
  uint32 wish_max_progress = 636;
  uint32 wish_progress = 1018;
  uint32 cur_schedule_daily_gacha_times = 2039;
  uint32 wish_item_id = 34;
  repeated GachaUpInfo gacha_up_info_list = 2013;
}
