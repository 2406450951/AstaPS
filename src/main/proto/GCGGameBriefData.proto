syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGGameBriefDataOuterClass";
import "GCGGameBusinessType.proto";
import "GCGPlayerBriefData.proto";

message GCGGameBriefData {
  uint32 verify_code = 3;
  uint32 game_id = 7;
  GCGGameBusinessType business_type = 9;
  repeated GCGPlayerBriefData player_brief_list = 12;
  uint32 platform_type = 14;
  uint32 game_uid = 15;
}
