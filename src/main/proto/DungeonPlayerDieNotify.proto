syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AbilityString.proto";
import "PlayerDieType.proto";
import "StrengthenPointData.proto";

message DungeonPlayerDieNotify {
  map<uint32, StrengthenPointData> strengthen_point_data_map = 9;
  AbilityString MCPNIFKDECF = 15;
  uint32 murderer_entity_id = 20001;
  uint32 revive_count = 1;
  PlayerDieType die_type = 10;
  uint32 OBOKABMLGHI = 20002;
  uint32 dungeon_id = 7;
  uint32 AOMDIHGJMNK = 20003;
  uint32 wait_time = 11;
  oneof entity {
    uint32 monster_id = 13;
    uint32 gadget_id = 6;
  }
}
