syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GadgetPlayUidInfoOuterClass";
import "ProfilePicture.proto";

message GadgetPlayUidInfo {
  uint32 battle_watcher_id = 3;
  string nickname = 4;
  ProfilePicture profile_picture = 9;
  string online_id = 10;
  uint32 uid = 11;
  uint32 icon = 12;
  uint32 score = 15;
}
