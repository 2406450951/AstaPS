syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatLevelInfoOuterClass";
import "RoleCombatTargetInfo.proto";

message RoleCombatLevelInfo {
  uint32 monster_level = 5;
  repeated RoleCombatTargetInfo target_list = 13;
  uint32 level_id = 15;
}
