syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CharAmusementInfoOuterClass";
import "CharAmusementAvatarInfo.proto";

message CharAmusementInfo {
  uint32 preview_stage_index = 1;
  uint32 total_cost_time = 2;
  uint32 level_id = 3;
  repeated CharAmusementAvatarInfo avatar_info_list = 4;
  uint32 stage_id = 5;
}
