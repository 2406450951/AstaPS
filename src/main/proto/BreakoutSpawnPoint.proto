syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "BreakoutPhysicalObject.proto";
import "_Vector2Int.proto";

message BreakoutSpawnPoint {
  repeated BreakoutPhysicalObject spawned_brick_list = 3;
  repeated _Vector2Int DLDMILGJGGE = 6;
  repeated int32 int_param_list = 7;
  uint32 id = 1;
  uint32 brick_suite_id = 2;
  uint32 MBBPLHFNMPF = 5;
  uint32 DCFANKBDLIP = 4;
}
