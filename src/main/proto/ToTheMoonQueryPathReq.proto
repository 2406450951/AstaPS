syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ToTheMoonQueryPathReqOuterClass";
import "AStarMethod.proto";
import "FilterType.proto";
import "ToTheMoonQueryPathReq__OptionType.proto";
import "Vector.proto";

// 7.2 CmdId 6111
message ToTheMoonQueryPathReq {
  int32 query_id = 1;
  int32 fuzzy_range = 3;
  uint32 scene_id = 4;
  AStarMethod astar_method = 5;
  Vector source_pos = 6;
  bool refined = 7;
  FilterType filter_type = 8;
  Vector destination_pos = 9;
  repeated Vector EJPDAKIHAOC = 10;
  repeated int32 GLPAHIHKILJ = 13;
  ToTheMoonQueryPathReq__OptionType query_type = 14;
}
