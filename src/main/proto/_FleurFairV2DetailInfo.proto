syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "FleurFairV2MusicGameInfo.proto";
import "FleurFairV2PacmanInfo.proto";
import "FleurFairV2PhotoInfo.proto";

message _FleurFairV2DetailInfo {
