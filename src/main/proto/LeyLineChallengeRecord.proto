syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LeyLineChallengeRecordOuterClass";
import "LeyLineChallengeRecordExtra.proto";
import "LeyLineChallengeRecordTeam.proto";

message LeyLineChallengeRecord {
  bool is_finished = 1;
  uint32 cost_time = 3;
  LeyLineChallengeRecordExtra PHGNBOEGAAP = 4;
  repeated LeyLineChallengeRecordTeam team_info_list = 9;
  repeated uint64 equip_guid_list = 13;
  uint32 KDBLHFFGAJL = 15;
}
