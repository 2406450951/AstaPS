syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FleurFairV2MusicGameSettleRspOuterClass";
message FleurFairV2MusicGameSettleRsp {
  int32 retcode = 1;
  uint32 music_basic_id = 2;
  bool is_unlock_next_level = 3;
  bool is_new_record = 4;
  uint64 ugc_guid = 5;
}
