syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_PenumbraAdventureTargetShootingSettleInfoOuterClass";
message _PenumbraAdventureTargetShootingSettleInfo {
  uint32 uid = 1;
  uint32 score = 2;
  uint32 _max_combo_num = 3;
  uint32 kill_num = 4;
  bool is_new_record = 5;
}
