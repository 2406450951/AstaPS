syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_GCGMsgFieldUpdateOuterClass";
import "GCGCard.proto";
import "GCGZone.proto";

message _GCGMsgFieldUpdate {
  GCGZone COLNLDLJIJA = 1;
  map<uint32, GCGZone> modify_zone_map = 4;
  uint32 JEOHBNCMMLK = 6;
  uint32 controller_id = 7;
  GCGZone HHCKILNPNMD = 9;
  repeated GCGCard card_list = 10;
  GCGZone JDPPOLJBGLI = 11;
  GCGZone OCEIJFFPMAM = 13;
  GCGZone POGMAACKGAJ = 14;
}
