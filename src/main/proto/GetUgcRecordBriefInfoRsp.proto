syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcRecordBriefInfoRspOuterClass";
import "BKNOJABCGDP.proto";
import "JGIJLNBFGBO.proto";
import "MLELNCBLODK.proto";
import "UgcType.proto";

// 7.2 CmdId 1189
message GetUgcRecordBriefInfoRsp {
  UgcType ugc_type = 5;
  int32 retcode = 7;
  uint32 level_id = 8;
  bool IHLCAMDIKJB = 13;
  repeated BKNOJABCGDP HENGBCDLIIO = 14;
  oneof info {
    JGIJLNBFGBO MusicInfo = 2;
    MLELNCBLODK LanV5CardInfo = 10;
  }
}
