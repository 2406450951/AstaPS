syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "RecordUsage.proto";
import "UgcMusicBriefInfo.proto";
import "UgcMusicRecord.proto";
import "UgcType.proto";
import "_UgcLanV5CardBriefInfo.proto";
import "_UgcLanV5CardRecord.proto";
import "_UgcShortVideoBriefInfo.proto";
import "_UgcShortVideoRecord.proto";

message GetUgcRsp {
  int32 retcode = 3;
  uint64 ugc_guid = 8;
  RecordUsage ugc_record_usage = 6;
  UgcType ugc_type = 10;
  oneof record {
    _UgcShortVideoRecord short_video_record = 15;
    _UgcLanV5CardRecord lan_v_5_card_record = 9;
    UgcMusicRecord music_record = 11;
  }
  oneof brief {
    _UgcLanV5CardBriefInfo lan_v_5_card_brief_info = 861;
    _UgcShortVideoBriefInfo short_video_brief_info = 527;
    UgcMusicBriefInfo music_brief_info = 798;
  }
}
