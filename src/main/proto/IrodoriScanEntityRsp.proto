syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "IrodoriScanEntityRspOuterClass";
import "IrodoriPoetryThemeData.proto";

message IrodoriScanEntityRsp {
  int32 retcode = 1;
  bool is_get_inspiration = 2;
  IrodoriPoetryThemeData theme_data = 3;
}
