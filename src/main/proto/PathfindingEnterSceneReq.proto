syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PathfindingEnterSceneReqOuterClass";
import "ObstacleInfo.proto";
import "_AddInfo.proto";

// 7.2 CmdId 2375
message PathfindingEnterSceneReq {
  repeated int32 HMJBPGEPAII = 2;
  uint32 NOGIGNFDIEB = 3;
  repeated ObstacleInfo obstacles = 4;
  bool is_editor = 5;
  uint32 AIBADOKMLAN = 10;
  uint32 version = 11;
  uint32 scene_id = 12;
  repeated _AddInfo GMJIAGNEOGJ = 14;
}
