syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message Reliquary {
  repeated uint32 _purchased_append_prop_id_list = 7;
  repeated uint32 append_prop_id_list = 5;
  repeated uint32 _definite_append_prop_id_list = 8;
  bool _is_relic_starred = 6;
  uint32 main_prop_id = 4;
  uint32 promote_level = 3;
  uint32 exp = 2;
  uint32 level = 1;
}
