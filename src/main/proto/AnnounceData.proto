syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

message AnnounceData {
  string dungeon_confirm_text = 8;
  string count_down_text = 7;
  string center_system_text = 9;
  bool is_center_system_last_5_every_minutes = 1;
  uint32 count_down_frequency = 11;
  uint32 config_id = 2;
  uint32 end_time = 15;
  uint32 begin_time = 4;
  uint32 center_system_frequency = 6;
}
