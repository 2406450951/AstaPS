syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BartenderCompleteOrderReqOuterClass";
import "ItemParam.proto";

message BartenderCompleteOrderReq {
  repeated ItemParam item_list = 1;
  uint32 AKIEBIJJHOA = 2;
  uint32 quest_id = 3;
  repeated uint32 optional_order_list = 4;
  uint32 AJEDPGGHJGD = 5;
  uint32 EAGFIBGHGLP = 6;
  bool is_view_formula = 7;
}
