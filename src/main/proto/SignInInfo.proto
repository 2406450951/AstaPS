syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SignInInfoOuterClass";
import "SignInData.proto";

message SignInInfo {
  uint32 config_id = 2;
  bool ENHNJGDADIC = 3;
  uint32 LMNBFKAKMEN = 6;
  repeated SignInData signin_data_list = 7;
  uint32 end_time = 9;
  uint32 schedule_id = 10;
  uint32 HDKLJHDJNBH = 11;
  repeated uint32 reward_day_list = 12;
  bool LNDBMBFPLMK = 13;
  uint32 begin_time = 14;
}
