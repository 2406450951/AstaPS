syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CustomDungeonSettingOuterClass";
message CustomDungeonSetting {
  bool is_forbid_skill = 2;
  uint32 KMEMOBHOEFI = 5;
  uint32 life_num = 7;
  bool is_arrive_finish = 8;
  uint32 EFCALBIAMOB = 12;
  uint32 CGLCHBIKOMO = 13;
  repeated uint32 open_room_list = 15;
}
