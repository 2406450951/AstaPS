syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InBattleMechanicusCardInfoOuterClass";
import "InBattleMechanicusCardChallengeState.proto";

message InBattleMechanicusCardInfo {
  uint32 card_id = 1;
  uint32 cost_points = 2;
  uint32 NBNFKOOMFAM = 3;
  uint32 LMIPCBNAAEH = 4;
  uint32 NCNLDFOCPGM = 5;
  InBattleMechanicusCardChallengeState challenge_state = 6;
}
