syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatRentalAvatarBriefOuterClass";
message RoleCombatRentalAvatarBrief {
  uint32 avatar_id = 1;
  uint32 level = 2;
  uint32 costume_id = 3;
  uint32 _talent_level = 4;
  uint32 _avatar_element_type = 5;
}
