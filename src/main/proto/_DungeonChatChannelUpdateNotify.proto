syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_DungeonChatChannelUpdateNotifyOuterClass";
import "ChatChannelInfo.proto";
import "_ChatChannelPlayerInfo.proto";

// 7.2 CmdId 353
message _DungeonChatChannelUpdateNotify {
  _ChatChannelPlayerInfo _channel_player_info = 2;
  bool is_create = 7;
  uint32 channel_id = 11;
  ChatChannelInfo channel_info = 12;
  uint32 dungeon_id = 14;
}
