syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "ServerBuff.proto";

message ServerBuffChangeNotify {
  enum ServerBuffChangeType {
    ServerBuffChangeType_ADD_SERVER_BUFF = 0;
    ServerBuffChangeType_DEL_SERVER_BUFF = 1;
  }
  repeated ServerBuff server_buff_list = 14;
  repeated uint32 entity_id_list = 9;
  repeated uint64 avatar_guid_list = 4;
  ServerBuffChangeNotify.ServerBuffChangeType server_buff_change_type = 1;
  bool is_creature_buff = 3;
}
