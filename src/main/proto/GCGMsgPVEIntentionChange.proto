syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGMsgPVEIntentionChangeOuterClass";
import "GCGIntentionChangeType.proto";
import "GCGMsgPVEIntention.proto";

message GCGMsgPVEIntentionChange {
  repeated GCGMsgPVEIntention change_intention_list = 7;
  GCGIntentionChangeType change_type = 14;
}
