syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SaveUgcRspOuterClass";
import "ECPCIMOBPPM.proto";
import "UgcMusicBriefInfo.proto";
import "UgcType.proto";
import "_UgcLanV5CardBriefInfo.proto";

// 7.2 CmdId 8131
message SaveUgcRsp {
  ECPCIMOBPPM DANKKDPNDHJ = 4;
  int32 retcode = 6;
  bool HHPLLKBDDOP = 8;
  uint64 ugc_guid = 11;
  UgcType ugc_type = 12;
  oneof brief {
    _UgcLanV5CardBriefInfo LanV5CardBriefInfo = 13;
    UgcMusicBriefInfo MusicBriefInfo = 15;
  }
}
