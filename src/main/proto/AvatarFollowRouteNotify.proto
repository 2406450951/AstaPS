syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarFollowRouteNotifyOuterClass";
import "Route.proto";

// 7.2 CmdId 7558
message AvatarFollowRouteNotify {
  string client_params = 5;
  Route route = 7;
  uint32 start_scene_time_ms = 8;
  uint32 template_id = 9;
  uint32 entity_id = 11;
}
