syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetOnlinePlayerInfoReqOuterClass";
// 7.2 CmdId 22360
message GetOnlinePlayerInfoReq {
  bool is_online_id = 3;
  oneof ADCDJIJAIEK {
    uint32 TargetUid = 8;
    string XboxUserId = 11;
    string OnlineId = 13;
    string PsnId = 15;
  }
}
