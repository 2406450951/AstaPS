syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeBlueprintSlotInfoOuterClass";
message HomeBlueprintSlotInfo {
  string share_code = 1;
  uint32 scene_id = 3;
  bool _is_copy_need_approval = 4;
  uint32 create_time = 5;
  uint32 module_id = 8;
  uint32 block_id = 9;
  uint32 slot_id = 13;
  bool is_allow_copy = 15;
}
