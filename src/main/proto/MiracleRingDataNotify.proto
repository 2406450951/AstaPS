syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MiracleRingDataNotifyOuterClass";
// 7.2 CmdId 22775
message MiracleRingDataNotify {
  uint32 last_take_reward_time = 1;
  uint32 gadget_entity_id = 3;
  uint32 miracle_ring_cd = 6;
  uint32 last_deliver_item_time = 11;
  bool is_gadget_created = 12;
}
