syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "PlayerDieType.proto";
import "ServerBuff.proto";

message LifeStateChangeNotify {
  repeated string EEOIMNHKALK = 14;
  string attack_tag = 11;
  repeated ServerBuff server_buff_list = 1;
  uint32 entity_id = 10;
  uint32 source_entity_id = 7;
  uint32 client_sequence_id = 4;
  uint32 move_reliable_seq = 2;
  uint32 life_state = 13;
  uint32 AFPBFDHCDNK = 8;
  uint32 LDAODDFLPGB = 15;
  PlayerDieType die_type = 9;
}
