syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGMsgSkillLimitsChangeOuterClass";
import "GCGCardSkillLimitsInfo.proto";
import "GCGReason.proto";

message GCGMsgSkillLimitsChange {
  repeated GCGCardSkillLimitsInfo _card_limits_change_list = 3;
  GCGReason reason = 13;
  uint32 controller_id = 14;
}
