syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneRouteChangeInfoOuterClass";
import "RoutePointChangeInfo.proto";

message SceneRouteChangeInfo {
  uint32 route_id = 3;
  uint32 type = 8;
  bool is_forward = 11;
  repeated RoutePointChangeInfo point_list = 14;
}
