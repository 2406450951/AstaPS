syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PHCCBLLCBJHOuterClass";
import "ProfilePicture.proto";

message PHCCBLLCBJH {
  string _xbox_gamertag = 4;
  string psn_id = 5;
  string online_id = 9;
  uint32 uid = 10;
  ProfilePicture profile_picture = 13;
  string nick_name = 14;
}
