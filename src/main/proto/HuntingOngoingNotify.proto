syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HuntingOngoingNotifyOuterClass";
import "HuntingPair.proto";
import "Vector.proto";

// 7.2 CmdId 20887
message HuntingOngoingNotify {
  uint32 fail_time = 3;
  Vector next_position = 6;
  bool is_started = 7;
  uint32 finish_clue_count = 8;
  bool is_final = 9;
  HuntingPair hunting_pair = 14;
}
