syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TakeAllForgeOutputRspOuterClass";

import "ItemHint.proto";

message _TakeAllForgeOutputRsp {
  repeated ItemHint output_item_list = 20000;
  repeated ItemHint extra_output_item_list = 13;
  repeated ItemHint return_item_list = 20001;
  repeated int32 unknown_list = 3;
  int32 retcode = 12;
}
