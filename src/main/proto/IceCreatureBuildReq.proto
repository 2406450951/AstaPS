syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "AbilityScalarValueEntry.proto";
import "BPAEPJHBOFM.proto";
import "IceCreatureGadgetInfo.proto";
import "Vector.proto";

message IceCreatureBuildReq {
  IceCreatureLimitType limit_type = 10;
  Vector pos = 1;
  repeated AbilityScalarValueEntry global_value_list = 20001;
  uint32 map_layer_id = 8;
  bool unk_11 = 20002;
  BPAEPJHBOFM build_detail = 20003;
  Vector rot = 9;
  repeated fixed64 replace_guid_list = 20004;
  uint32 gadget_id = 15;
}
