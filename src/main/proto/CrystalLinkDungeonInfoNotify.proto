syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CrystalLinkDungeonInfoNotifyOuterClass";
import "CrystalLinkBuffInfo.proto";
import "CrystalLinkDungeonAvatarInfo.proto";

message CrystalLinkDungeonInfoNotify {
  uint32 level_id = 1;
  uint32 difficulty_id = 2;
  bool is_upper_part = 3;
  repeated CrystalLinkDungeonAvatarInfo dungeon_avatar_info_list = 4;
  repeated CrystalLinkBuffInfo buff_info_list = 5;
  uint32 init_gallery_progress = 6;
}
