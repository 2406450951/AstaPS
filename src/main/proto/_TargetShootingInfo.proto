syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TargetShootingInfoOuterClass";
import "HAGAAKCFLKH.proto";

message _TargetShootingInfo {
  bool is_single = 1;
  repeated uint32 player_uid_list = 2;
  uint32 match_id = 3;
  repeated HAGAAKCFLKH BCKMMMPIFEA = 4;
  uint32 level_id = 5;
  uint32 play_index = 6;
}
