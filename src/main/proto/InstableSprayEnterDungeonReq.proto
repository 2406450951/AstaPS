syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InstableSprayEnterDungeonReqOuterClass";
import "InstableSprayAvatarInfo.proto";

message InstableSprayEnterDungeonReq {
  uint32 stage_id = 1;
  uint32 difficulty = 2;
  repeated InstableSprayAvatarInfo avatar_info_list = 3;
}
