syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGOperationPlayCardOuterClass";
message GCGOperationPlayCard {
  uint32 replace_card_guid = 4;
  repeated uint32 cost_dice_index_list = 6;
  repeated uint32 target_card_guid_list = 12;
  uint32 card_guid = 14;
}
