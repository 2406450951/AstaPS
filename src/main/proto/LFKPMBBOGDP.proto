syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "Vector.proto";

message LFKPMBBOGDP {
  Vector region_center_pos = 5;
  repeated uint32 GHGKAOABLFK = 20000;
  bool is_open = 2;
  bool is_finish = 3;
  uint32 level_id = 1;
  uint32 open_time = 8;
  float region_radius = 6;
  uint32 scene_id = 7;
}
