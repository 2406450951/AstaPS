syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BGOCEPMNBFKOuterClass";
import "AuditState.proto";
import "FMHCAACBHBN.proto";
import "MFKNOGJFHBJ.proto";

message BGOCEPMNBFK {
  repeated MFKNOGJFHBJ JCNEKFPIAJP = 3;
  fixed32 FGPKLINHMFA = 5;
  FMHCAACBHBN rule_type = 8;
  AuditState audit_state = 9;
}
