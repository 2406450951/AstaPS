syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LocalLegendMonsterInfoOuterClass";
import "Vector.proto";

message _LocalLegendMonsterInfo {
  bool is_alive = 2;
  Vector pos = 5;
  uint32 JCCEMMLKJPK = 8;
  uint32 _map_layer_id = 9;
  uint32 scene_id = 10;
  uint32 NBLALAFJBMD = 12;
  uint32 next_refresh_time = 13;
}
