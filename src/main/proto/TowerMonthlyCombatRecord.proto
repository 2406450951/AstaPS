syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerMonthlyCombatRecordOuterClass";
import "TowerFightRecordPair.proto";

message TowerMonthlyCombatRecord {
  TowerFightRecordPair PFLAIHDNEEJ = 1;
  TowerFightRecordPair OFDPKEPECIK = 6;
  TowerFightRecordPair AKNKIMOMHAE = 10;
  TowerFightRecordPair OCKFPKCBCLC = 11;
  TowerFightRecordPair DKAMFPDDNJD = 12;
  repeated TowerFightRecordPair most_reveal_avatar_list = 13;
}
