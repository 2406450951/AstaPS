syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaItemOuterClass";

import "GachaTransferItem.proto";
import "ItemParam.proto";

message GachaItem {
  bool is_flash_card = 15;
  bool is_gacha_item_new = 14;
  ItemParam gacha_item = 9;
  repeated GachaTransferItem transfer_items = 1;
  repeated ItemParam token_item_list = 7;
}
