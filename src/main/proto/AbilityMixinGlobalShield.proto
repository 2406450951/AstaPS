syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMixinGlobalShieldOuterClass";
message AbilityMixinGlobalShield {
  bool is_create_effect = 4;
  float sub_shield = 5;
  uint32 avatar_id = 7;
  float max_shield = 8;
  float height_offset = 10;
  string shield_effect_name = 13;
}
