syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGGameCreateReasonOuterClass";
enum GCGGameCreateReason {
  GCGGAME_CREATE_REASON_REASON_NONE = 0;
  GCGGAME_CREATE_REASON_REASON_GAME_MAX = 1;
  GCGGAME_CREATE_REASON_REASON_CLIENT_VERSION_NOT_LASTEST = 2;
  GCGGAME_CREATE_REASON_REASON_RESOURCE_NOT_COMPLETE = 3;
  GCGGAME_CREATE_REASON_REASON_TIMEOUT = 4;
  GCGGAME_CREATE_REASON_REASON_OPPONENT_CLIENT_VERSION_NOT_LASTEST = 5;
}
