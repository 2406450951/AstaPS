syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ODKEPCKDPPEOuterClass";
message ODKEPCKDPPE {
  uint32 OKEAJEOLEDH = 1;
  uint32 game_id = 4;
  uint32 FANFNPKJGDN = 7;
  uint32 JFBHOBINECI = 11;
  uint32 settle_score = 13;
  uint32 score = 15;
}
