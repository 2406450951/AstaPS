syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtLightCoreMoveOuterClass";
import "Vector.proto";

message EvtLightCoreMove {
  uint32 entity_id = 2;
  Vector target_pos = 4;
  float speed = 7;
  float IGBBMNBGHNF = 11;
  float HBDIKLPPEDD = 13;
}
