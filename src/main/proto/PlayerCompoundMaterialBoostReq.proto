syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerCompoundMaterialBoostReqOuterClass";
// 7.2 CmdId 3054
message PlayerCompoundMaterialBoostReq {
  uint32 consume_material_count = 3;
  bool is_boost_all = 6;
  uint32 target_compound_group_id = 9;
  uint32 consume_material_id = 12;
}
