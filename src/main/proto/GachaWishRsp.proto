syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaWishRspOuterClass";

message GachaWishRsp {
  uint32 wish_item_id = 15;
  uint32 gacha_schedule_id = 13;
  int32 retcode = 7;
  uint32 wish_progress = 1;
  uint32 gacha_type = 10;
  uint32 wish_max_progress = 6;
}
