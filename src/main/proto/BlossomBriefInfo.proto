syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "Vector.proto";

message BlossomBriefInfo {
  Vector pos = 14;
  uint32 refresh_id = 7;
  uint32 city_id = 11;
  bool is_guide_opened = 13;
  uint32 scene_id = 12;
  uint32 _map_layer_id = 9;
  uint32 circle_camp_id = 1;
  uint32 resin = 10;
  uint32 monster_level = 4;
  uint32 state = 3;
  uint32 reward_id = 8;
}
