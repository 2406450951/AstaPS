  GCGPHASE_TYPE_GCG_PHASE_START = 1;
  GCGPHASE_TYPE_GCG_PHASE_DRAW = 2;
  GCGPHASE_TYPE_GCG_PHASE_ON_STAGE = 3;
  GCGPHASE_TYPE_GCG_PHASE_DICE = 4;
  GCGPHASE_TYPE_GCG_PHASE_MAIN = 5;
  GCGPHASE_TYPE_GCG_PHASE_END = 6;
  GCGPHASE_TYPE_GCG_PHASE_DIE = 7;
  GCGPHASE_TYPE_GCG_PHASE_FIN = 8;
  GCGPHASE_TYPE_GCG_PHASE_PRE_MAIN = 9;
  GCGPHASE_TYPE_GCG_PHASE_REROLL = 10;
  GCGPHASE_TYPE_GCG_PHASE_REDRAW = 11;
  GCGPHASE_TYPE_GCG_PHASE_DISCOVER = 12;
  GCGPHASE_TYPE_GCG_PHASE_AUTO_BATTLE_CARD_START = 13;
  GCGPHASE_TYPE_GCG_PHASE_AUTO_BATTLE_CARD_MAIN = 14;
  GCGPHASE_TYPE_GCG_PHASE_AUTO_BATTLE_CARD_PRE_MAIN = 15;
