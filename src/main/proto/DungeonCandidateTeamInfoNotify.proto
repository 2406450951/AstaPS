syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DungeonCandidateTeamInfoNotifyOuterClass";
import "DungeonCandidateTeamAvatar.proto";
import "DungeonCandidateTeamPlayerState.proto";
import "_UgcDungeonCandidateTeamInfo.proto";

// 7.2 CmdId 6323
message DungeonCandidateTeamInfoNotify {
  repeated DungeonCandidateTeamAvatar avatar_list = 1;
  repeated uint32 ready_player_uid = 2;
  uint32 match_type = 9;
  uint32 dungeon_id = 10;
  map<uint32, DungeonCandidateTeamPlayerState> player_state_map = 15;
  oneof detail {
    _UgcDungeonCandidateTeamInfo UgcTeamInfo = 1595;
  }
}
