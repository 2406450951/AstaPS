syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GalleryStartNotifyOuterClass";
import "GalleryElectroherculesBattleStartParam.proto";
import "GalleryFlowerStartParam.proto";

// 7.2 CmdId 21594
message GalleryStartNotify {
  uint32 owner_uid = 3;
  uint32 gallery_id = 4;
  uint32 end_time = 10;
  uint32 start_time = 12;
  uint32 player_count = 14;
  oneof detail {
    GalleryElectroherculesBattleStartParam ElectroherculesStartParam = 11;
    GalleryFlowerStartParam FlowerStartParam = 15;
  }
}
