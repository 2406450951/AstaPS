syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BrickBreakerPlayerBattleInfoOuterClass";
message BrickBreakerPlayerBattleInfo {
  uint32 uid = 1;
  repeated uint32 avatar_id = 2;
  repeated uint32 costume_id = 3;
  repeated uint32 skill_list = 4;
  bool is_ready = 5;
  string nickname = 6;
  bool is_changing = 7;
  repeated uint32 NHDEAPAJJKD = 8;
}
