syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SyncTypeOuterClass";
enum _SyncType {
  _SYNC_TYPE_NONE = 0;
  _SYNC_TYPE_CREATE_CONNECT = 1;
  _SYNC_TYPE_START_GAME = 2;
  _SYNC_TYPE_PING = 3;
  _SYNC_TYPE_FINISH_GAME = 4;
  _SYNC_TYPE_SNAP_SHOT = 5;
  _SYNC_TYPE_ACTION = 6;
  _SYNC_TYPE_SNAP_SHOT_FOR_DEBUG_LOG = 7;
}
