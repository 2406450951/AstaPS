syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GCGOperationOuterClass";
import "GCGOperationAttack.proto";
import "GCGOperationOnStageSelect.proto";
import "GCGOperationPass.proto";
import "GCGOperationPlayCard.proto";
import "GCGOperationReboot.proto";
import "GCGOperationRedraw.proto";
import "GCGOperationReroll.proto";
import "GCGOperationSurrender.proto";
import "_GCGOperationChangeCharacterIndex.proto";
import "_GCGOperationDiscover.proto";
import "_GCGOperationDiscoverRefresh.proto";
import "_GCGOperationVehicle.proto";

message GCGOperation {
  oneof op {
    _GCGOperationVehicle OpVehicle = 2;
    _GCGOperationChangeCharacterIndex OpChangeCharacterIndex = 3;
    GCGOperationPlayCard OpPlayCard = 4;
    GCGOperationRedraw OpRedraw = 5;
    GCGOperationReboot OpReboot = 7;
    GCGOperationReroll OpReroll = 8;
    GCGOperationSurrender OpSurrender = 9;
    GCGOperationAttack OpAttack = 10;
    GCGOperationPass OpPass = 11;
    _GCGOperationDiscover OpDiscover = 12;
    _GCGOperationDiscoverRefresh OpDiscoverRefresh = 13;
    GCGOperationOnStageSelect OpSelectOnStage = 15;
  }
}
