syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetRecommendUgcInfoRspOuterClass";
import "BKNOJABCGDP.proto";
import "KCCMPNNCOEM.proto";
import "UgcType.proto";
import "_LanV5Card.proto";

// 7.2 CmdId 21062
message GetRecommendUgcInfoRsp {
  int32 retcode = 7;
  repeated BKNOJABCGDP HENGBCDLIIO = 11;
  UgcType ugc_type = 13;
  oneof info {
    _LanV5Card LanV5Card = 12;
    KCCMPNNCOEM MusicInfo = 15;
  }
}
