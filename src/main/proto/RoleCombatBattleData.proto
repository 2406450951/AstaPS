syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RoleCombatBattleDataOuterClass";
import "RoleCombatAvatarBrief.proto";
import "RoleCombatAvatarPosition.proto";
import "RoleCombatAvatarUse.proto";
import "RoleCombatCardPool.proto";
import "RoleCombatFinishedLevelInfo.proto";
import "RoleCombatLevelInfo.proto";
import "RoleCombatStagePhase.proto";
import "Uint32Pair.proto";

message RoleCombatBattleData {
  uint32 NIGLCMBMJMB = 1;
  uint32 level_id = 2;
  uint32 coin_num = 3;
  repeated RoleCombatAvatarBrief reserve_avatar_list = 4;
  RoleCombatStagePhase _stage_phase = 5;
  RoleCombatCardPool card_pool = 6;
  uint32 _cur_round_num = 7;
  uint32 CAMCEBMPEAD = 8;
  repeated Uint32Pair build_group_list = 9;
  repeated RoleCombatFinishedLevelInfo finished_level_list = 10;
  repeated uint64 avatar_guid_list = 11;
  repeated RoleCombatAvatarUse avatar_use_list = 12;
  repeated RoleCombatAvatarPosition avatar_position_list = 13;
  RoleCombatLevelInfo level_info = 14;
  repeated uint32 passed_round_list = 15;
  uint32 NIAFEAJADDG = 446;
  bool EMJIPGEIHOJ = 555;
}
