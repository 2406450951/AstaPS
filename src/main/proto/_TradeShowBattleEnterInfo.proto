syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TradeShowBattleEnterInfoOuterClass";
import "_ActivityAvatarInfo.proto";

message _TradeShowBattleEnterInfo {
  uint32 difficulty_id = 1;
  repeated _ActivityAvatarInfo avatar_list = 7;
  bool _is_restart = 8;
}
