syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ShopOuterClass";

import "OLFKDMCHEDP.proto";
import "ShopCardProduct.proto";
import "ShopConcertProduct.proto";
import "ShopGoods.proto";
import "ShopMcoinProduct.proto";
import "_ShopBeyondMcoinProduct.proto";

message Shop {
  uint32 next_refresh_time = 8;
  OLFKDMCHEDP FAEEGIJKFJP = 6;
  repeated ShopCardProduct card_product_list = 13;
  uint32 city_reputation_level = 20001;
  repeated _ShopBeyondMcoinProduct _beyond_mcoin_product_list = 10;
  repeated ShopGoods goods_list = 4;
  uint32 hogdkcckgap = 20002;
  uint32 city_id = 5;
  repeated ShopConcertProduct concert_product_list = 12;
  repeated ShopMcoinProduct mcoin_product_list = 7;
  uint32 shop_type = 15;
}
