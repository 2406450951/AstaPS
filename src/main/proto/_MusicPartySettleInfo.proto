syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "DungeonSettleExhibitionInfo.proto";
import "ExhibitionDisplayInfo.proto";

message _MusicPartySettleInfo {
  repeated ExhibitionDisplayInfo score_list = 15;
  repeated DungeonSettleExhibitionInfo settle_info_list = 2;
  repeated uint32 winner_uid_list = 14;
  uint32 score = 3;
  uint32 LLCEEFFOGBH = 11;
}
