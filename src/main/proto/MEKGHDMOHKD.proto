syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MEKGHDMOHKDOuterClass";
import "PCBAMEIJKIO.proto";

message MEKGHDMOHKD {
  uint32 avatar_id = 1;
  uint32 level = 2;
  uint32 promote_level = 3;
  uint32 costume_id = 4;
  uint32 _talent_level = 5;
  uint32 _avatar_element_type = 6;
  bool NOBNHBNLCNJ = 7;
  repeated PCBAMEIJKIO weapon_list = 8;
  repeated PCBAMEIJKIO reliquary_list = 9;
}
