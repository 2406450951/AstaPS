syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeGroupPlayerInfoOuterClass";
import "ProfilePicture.proto";

message HomeGroupPlayerInfo {
  string _xbox_gamertag = 2;
  uint32 uid = 3;
  string online_id = 4;
  string nickname = 7;
  uint32 player_level = 8;
  ProfilePicture profile_picture = 9;
  string psn_id = 13;
  string _xuid = 14;
}
