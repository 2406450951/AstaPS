syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_UgcSuiteOuterClass";
import "_UgcEntityBasicInfo.proto";

message _UgcSuite {
  _UgcEntityBasicInfo basic_info = 1;
  repeated uint32 FJPKAMEIBPB = 2;
  repeated uint32 DNGIBMFFHFP = 4;
  repeated uint32 _monster_group_guid_list = 9;
  repeated uint32 CLPPICJNEJL = 12;
}
