syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityMetaUpdateBaseReactionDamageOuterClass";
import "AbilityIdentifier.proto";
import "AbilityString.proto";

message AbilityMetaUpdateBaseReactionDamage {
  AbilityString global_value_key = 5;
  AbilityString ability_name = 6;
  uint32 source_caster_id = 8;
  uint32 reaction_type = 11;
  AbilityIdentifier ability_identifier = 14;
}
