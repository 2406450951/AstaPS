syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_DungeonTeamBuilderAvatarInfoOuterClass";
import "AvatarInfo.proto";

message _DungeonTeamBuilderAvatarInfo {
  uint64 guid = 1;
  uint32 avatar_id = 2;
  AvatarInfo avatar_info = 3;
  uint32 costume_id = 4;
}
