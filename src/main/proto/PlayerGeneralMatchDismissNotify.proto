syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerGeneralMatchDismissNotifyOuterClass";
import "MatchReason.proto";

// 7.2 CmdId 26019
message PlayerGeneralMatchDismissNotify {
  MatchReason reason = 1;
  repeated uint32 uid_list = 9;
  uint32 match_id = 12;
}
