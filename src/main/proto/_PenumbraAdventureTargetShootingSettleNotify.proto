syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_PenumbraAdventureTargetShootingSettleNotifyOuterClass";
import "_PenumbraAdventureTargetShootingSettleInfo.proto";

message _PenumbraAdventureTargetShootingSettleNotify {
  uint32 play_index = 1;
  uint32 stage_type = 2;
  bool is_single = 3;
  uint32 score = 4;
  uint32 _max_combo_num = 5;
  repeated _PenumbraAdventureTargetShootingSettleInfo settle_info_list = 6;
  bool is_gallery_succ = 7;
  sfixed32 begin_time = 8;
  uint32 duration = 9;
  uint32 level_id = 10;
}
