syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneGalleryIslandPartyDownHillInfoOuterClass";
import "GalleryStartSource.proto";

message SceneGalleryIslandPartyDownHillInfo {
  uint32 coin = 7;
  uint32 max_kill_monster_count = 12;
  GalleryStartSource start_source = 13;
  uint32 total_kill_monster_count = 14;
}
