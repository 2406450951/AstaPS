syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomePlantSubFieldDataOuterClass";
import "HomePlantFieldStatus.proto";

message HomePlantSubFieldData {
  fixed32 end_time = 4;
  uint32 home_gather_id = 5;
  HomePlantFieldStatus field_status = 12;
  repeated uint32 entity_id_list = 13;
  uint32 seed_id = 15;
}
