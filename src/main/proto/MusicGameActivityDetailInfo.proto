syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";

import "MusicGameRecord.proto";
import "UgcMusicBriefInfo.proto";

message MusicGameActivityDetailInfo {
  repeated UgcMusicBriefInfo NCCMPNEBJLA = 20000;
  map<uint32, MusicGameRecord> music_game_record_map = 1;
  repeated UgcMusicBriefInfo EPEEHJNIPNB = 20001;
}
