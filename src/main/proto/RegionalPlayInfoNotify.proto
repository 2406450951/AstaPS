syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RegionalPlayInfoNotifyOuterClass";
import "RegionalPlayVar.proto";

// 7.2 CmdId 7103
message RegionalPlayInfoNotify {
  bool is_enabled = 1;
  repeated RegionalPlayVar var_list = 4;
  uint32 play_type = 9;
  string play_name = 13;
  bool is_in_region = 14;
  uint32 LOIAFGGOJEK = 15;
}
