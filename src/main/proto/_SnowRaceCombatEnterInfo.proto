syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SnowRaceCombatEnterInfoOuterClass";
import "_ActivityAvatarInfo.proto";

message _SnowRaceCombatEnterInfo {
  repeated _ActivityAvatarInfo avatar_list = 7;
  bool _is_restart = 11;
  uint32 difficulty = 12;
  repeated uint32 _combat_badge_id_list = 14;
}
