syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PotionEnterDungeonNotifyOuterClass";
import "PotionDungeonAvatar.proto";

message PotionEnterDungeonNotify {
  uint32 stage_id = 1;
  uint32 level_id = 2;
  uint32 difficulty_level = 3;
  uint32 mode_id = 4;
  repeated PotionDungeonAvatar dungeon_avatar_list = 5;
}
