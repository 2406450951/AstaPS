syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GMObstacleInfoOuterClass";
import "LIJBINOALHC.proto";
import "MathQuaternion.proto";
import "ObstacleInfo__ShapeType.proto";
import "Vector.proto";
import "Vector3Int.proto";

message GMObstacleInfo {
  ObstacleInfo__ShapeType shape = 3;
  Vector center = 5;
  Vector3Int extents = 7;
  MathQuaternion rotation = 8;
  int64 timestamp = 11;
  LIJBINOALHC EIPJDIBICMO = 13;
  int32 obstacle_id = 14;
}
