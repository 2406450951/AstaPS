syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HideAndSeekSettleNotifyOuterClass";
import "ExhibitionDisplayInfo.proto";
import "HideAndSeekSettleInfo.proto";
import "HideAndSeekSettleNotify__SettleReason.proto";

message HideAndSeekSettleNotify {
  uint32 play_index = 1;
  uint32 stage_type = 2;
  uint32 cost_time = 3;
  repeated uint32 winner_list = 4;
  HideAndSeekSettleNotify__SettleReason reason = 5;
  repeated ExhibitionDisplayInfo score_list = 6;
  repeated HideAndSeekSettleInfo settle_info_list = 7;
  bool is_record_score = 8;
}
