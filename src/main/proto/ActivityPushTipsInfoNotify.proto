syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ActivityPushTipsInfoNotifyOuterClass";
import "ActivityPushTipsData.proto";

// 7.2 CmdId 3690
message ActivityPushTipsInfoNotify {
  uint32 schedule_id = 3;
  uint32 activity_id = 7;
  repeated ActivityPushTipsData activity_push_tips_data_list = 9;
}
