name: Protocol generation

on:
  push:
    branches:
      - "**"
    paths:
      - "src/main/proto/**"
      - "src/generated/java/**"
      - "tools/protocol/**"
      - "gradle/protocol-generation.gradle"
      - "build.gradle"
      - "src/main/java/emu/grasscutter/net/packet/BasePacket.java"
      - "src/test/java/emu/grasscutter/net/ProtocolGenerationTest.java"
      - ".github/workflows/protocol-generation.yml"
  workflow_dispatch:

concurrency:
  group: protocol-generation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Generate and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradlew is committed without the execute bit in the upstream tree.
      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      # Regenerate the protocol Java from src/main/proto and fail if it differs from the checked-in
      # copy, then compile it with -Xlint:all -Werror and build the jar.
      - name: Regenerate, lint, and build
        shell: bash
        run: >-
          ./gradlew generateProtocolJava lintGeneratedProtocolJava jar
          --build-cache
          -PskipHandbook=1
          -PjarFilename=grasscutter
          -Dorg.gradle.jvmargs=-Xmx4g

      - name: Check checked-in protocol Java is up to date
        shell: bash
        run: |
          git add -N src/generated/java
          git diff --stat --exit-code -- src/generated/java
          echo "$(find src/generated/java -name '*.java' | wc -l | tr -d '[:space:]') protocol Java files match src/main/proto."

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-grasscutter-${{ matrix.os }}
          path: grasscutter.jar
          retention-days: 14
